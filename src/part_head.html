<style>
:root{
  --logo:url("{{LOGO_DATA_URI}}");
  --bg:#F6F7F5; --surface:#FFFFFF; --surface-2:#EFF2EF; --surface-hover:#E9ECE8;
  --border:#E1E4DF; --border-strong:#CDD2CA;
  --text:#14181A; --text-muted:#5B6660; --text-faint:#8B958E;
  --accent:#0E7C6B; --accent-strong:#095F52; --accent-soft:#E3F2EE; --accent-text-on:#FFFFFF;
  --warn:#96650D; --warn-soft:#FBF0DC;
  --danger:#B23A28; --danger-soft:#FBE8E4;
  --good-blue:#2E5F82; --good-blue-soft:#E7EEF3;
  --shadow: 0 1px 2px rgba(20,24,26,0.04), 0 4px 16px rgba(20,24,26,0.06);
  --shadow-lg: 0 8px 24px rgba(20,24,26,0.10), 0 2px 8px rgba(20,24,26,0.06);
  --radius-sm:6px; --radius:10px; --radius-lg:14px;
  --font-display:'Sora',ui-sans-serif,system-ui,sans-serif;
  --font-body:'IBM Plex Sans',ui-sans-serif,system-ui,-apple-system,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --sidebar-w: 240px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11171A; --surface:#171F22; --surface-2:#1D2629; --surface-hover:#233033;
    --border:#2A3538; --border-strong:#3A4649;
    --text:#EBF1EF; --text-muted:#9DACA6; --text-faint:#6C7A75;
    --accent:#34C9AE; --accent-strong:#57DFC5; --accent-soft:#153531; --accent-text-on:#06231E;
    --warn:#E2AC55; --warn-soft:#33280F;
    --danger:#E58272; --danger-soft:#331C17;
    --good-blue:#7FB0D6; --good-blue-soft:#182A35;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 16px rgba(0,0,0,0.35);
    --shadow-lg: 0 8px 28px rgba(0,0,0,0.45);
  }
}
:root[data-theme="dark"]{
  --bg:#11171A; --surface:#171F22; --surface-2:#1D2629; --surface-hover:#233033;
  --border:#2A3538; --border-strong:#3A4649;
  --text:#EBF1EF; --text-muted:#9DACA6; --text-faint:#6C7A75;
  --accent:#34C9AE; --accent-strong:#57DFC5; --accent-soft:#153531; --accent-text-on:#06231E;
  --warn:#E2AC55; --warn-soft:#33280F;
  --danger:#E58272; --danger-soft:#331C17;
  --good-blue:#7FB0D6; --good-blue-soft:#182A35;
  --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 16px rgba(0,0,0,0.35);
  --shadow-lg: 0 8px 28px rgba(0,0,0,0.45);
}

*{box-sizing:border-box;}
[hidden]{display:none !important;}
html,body{height:100%;}
body{
  background:var(--bg); color:var(--text); font-family:var(--font-body);
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--font-display); font-weight:600; text-wrap:balance; margin:0;}
::selection{background:var(--accent-soft); color:var(--text);}
a{color:inherit;}
button, input, textarea, select{font-family:inherit; font-size:inherit; color:inherit;}
button{cursor:pointer;}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px;}
::-webkit-scrollbar{width:10px; height:10px;}
::-webkit-scrollbar-thumb{background:var(--border-strong); border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}
@media (prefers-reduced-motion: reduce){ *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;} }

.tabular{font-variant-numeric:tabular-nums;}

/* ---------- Access gate ---------- */
.gate{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; background:
  radial-gradient(1200px 600px at 15% -10%, var(--accent-soft), transparent 60%),
  radial-gradient(900px 500px at 110% 10%, var(--good-blue-soft), transparent 55%), var(--bg);}
.gate-card{width:min(440px,100%); background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); box-shadow:var(--shadow-lg); padding:30px 28px;}
.gate-mark{width:46px; height:46px; background:var(--logo) center/contain no-repeat;}
.gate-mark svg{width:21px; height:21px;}
.gate h1{font-size:20px; letter-spacing:-0.01em; margin:16px 0 4px;}
.gate p.sub{color:var(--text-muted); font-size:13px; margin-bottom:20px;}
.gate label{display:block; font-size:12px; font-weight:600; color:var(--text-muted); margin-bottom:6px;}
.gate input{width:100%; padding:11px 13px; font-size:14px; letter-spacing:.04em; text-transform:uppercase; border-radius:var(--radius-sm); border:1.5px solid var(--border-strong); background:var(--surface);}
.gate input.name-input{text-transform:none; letter-spacing:normal;}
.gate input:focus{border-color:var(--accent);}
.gate .gate-error{color:var(--danger); font-size:12.5px; margin-top:8px; min-height:16px;}
.gate .btn-primary{width:100%; justify-content:center; padding:11px; margin-top:14px; font-size:14px;}
.gate .gate-hint{margin-top:18px; padding-top:16px; border-top:1px solid var(--border); font-size:12px; color:var(--text-faint);}
.gate .gate-hint code{font-family:var(--font-mono); background:var(--surface-2); padding:2px 6px; border-radius:5px; color:var(--text-muted); cursor:pointer;}
.gate .gate-hint code:hover{background:var(--surface-hover); color:var(--text);}
.gate-admin-link{background:none; border:none; color:var(--text-faint); font-size:12px; font-weight:600; padding:0;}
.gate-admin-link:hover{color:var(--accent-strong);}

/* ---------- Admin console ---------- */
#admin-root{min-height:100vh; background:var(--bg);}
.admin-shell{max-width:1120px; margin:0 auto; padding:24px 24px 64px;}
.admin-top{display:flex; align-items:center; gap:12px; margin-bottom:18px;}
.admin-top h1{font-size:18px; flex:1;}
.admin-table{width:100%; border-collapse:collapse; font-size:12.5px;}
.admin-table th{text-align:left; color:var(--text-faint); font-weight:600; font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; padding:8px 10px; border-bottom:1px solid var(--border);}
.admin-table td{padding:9px 10px; border-bottom:1px solid var(--border); vertical-align:top;}
.admin-table tr:hover td{background:var(--surface-2);}
.admin-code{font-family:var(--font-mono); font-weight:600;}
.switch{width:34px; height:20px; border-radius:99px; background:var(--border-strong); position:relative; display:inline-block; flex:none; transition:background .15s; border:none; padding:0; cursor:pointer;}
.switch.on{background:var(--accent);}
.switch i{position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:#fff; transition:left .15s;}
.switch.on i{left:16px;}
.checkgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:5px 16px; max-height:240px; overflow:auto; border:1px solid var(--border); border-radius:var(--radius-sm); padding:12px; background:var(--surface-2);}
.checkgrid label{display:flex; gap:7px; align-items:flex-start; font-size:12.5px; font-weight:400; color:var(--text); cursor:pointer; line-height:1.4;}
.checkgrid input{margin-top:2px;}
.checkgrid label.cg-hidden{display:none;}
.cg-bar{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:-2px 0 8px;}
.cg-selall{display:inline-flex; gap:7px; align-items:center; font-size:12px; font-weight:600; color:var(--text); background:var(--surface-2); border:1px solid var(--border-strong); border-radius:var(--radius-sm); padding:4px 10px; cursor:pointer;}
.cg-selall:hover{background:var(--surface-3,var(--surface-2)); border-color:var(--accent);}
.cg-selall:focus-visible{outline:2px solid var(--accent); outline-offset:1px;}
.cg-selall .cg-ind{width:13px; height:13px; border:1.5px solid var(--border-strong); border-radius:3px; position:relative; flex:none; background:var(--surface);}
.cg-selall[data-state="all"] .cg-ind{background:var(--accent); border-color:var(--accent);}
.cg-selall[data-state="all"] .cg-ind::after{content:""; position:absolute; left:3px; top:0px; width:4px; height:8px; border:solid #fff; border-width:0 2px 2px 0; transform:rotate(45deg);}
.cg-selall[data-state="some"] .cg-ind{background:var(--accent); border-color:var(--accent);}
.cg-selall[data-state="some"] .cg-ind::after{content:""; position:absolute; left:2px; top:5px; width:7px; height:2px; background:#fff;}
.cg-selall .cg-count{color:var(--text-faint); font-weight:400;}
.cg-filter{font-size:12px; padding:4px 8px; border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--surface); color:var(--text); min-width:130px;}
.role-fn-group{grid-column:1/-1; font-size:10px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-faint); font-weight:700; margin:8px 0 2px;}

/* ---------- "View as" preview banner ---------- */
body.previewing{--pbh:38px;}
#preview-banner{position:fixed; top:0; left:0; right:0; height:var(--pbh); z-index:85;
  display:flex; align-items:center; gap:12px; padding:0 14px; background:var(--warn); color:#1c1300;
  font-size:12.5px; font-weight:600; box-shadow:0 2px 10px rgba(0,0,0,.18);}
#preview-banner svg{width:15px; height:15px; flex:none;}
#preview-banner span{white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
#preview-banner select{background:rgba(255,255,255,.9); border:none; border-radius:6px; padding:4px 8px;
  font-weight:600; color:#1c1300; max-width:260px; margin-left:auto;}
#preview-banner .pb-x{background:#1c1300; color:var(--warn); border:none; border-radius:6px;
  padding:6px 12px; font-weight:700; cursor:pointer; flex:none;}
body.previewing #app{margin-top:var(--pbh);}
body.previewing .sidebar{top:var(--pbh); height:calc(100vh - var(--pbh));}
body.previewing .topbar{top:var(--pbh);}
@media (max-width:880px){ #preview-banner select{max-width:118px;} #preview-banner .pb-scope{display:none;} }
.gate-resolved{margin-top:10px; padding:10px 12px; background:var(--accent-soft); color:var(--accent-strong); border-radius:var(--radius-sm); font-size:12.5px;}

/* ---------- App shell ---------- */
#app{display:flex; min-height:100vh;}

.sidebar{
  width:var(--sidebar-w); flex:none; background:var(--surface); border-right:1px solid var(--border);
  display:flex; flex-direction:column; position:sticky; top:0; height:100vh; overflow-y:auto;
}
.sb-resizer{display:none;}
@media (min-width:881px){
  .sb-resizer{display:block; position:fixed; top:0; bottom:0; left:calc(var(--sidebar-w) - 5px); width:10px; z-index:30; cursor:col-resize; touch-action:none; outline:none;}
  body.previewing .sb-resizer{top:var(--pbh);}
  .sb-resizer::before{content:""; position:absolute; top:0; bottom:0; left:4px; width:2px; background:transparent; transition:background .12s;}
  .sb-resizer::after{content:""; position:absolute; top:45%; left:1px; width:8px; height:40px; border-radius:6px; background:var(--accent); opacity:0; transition:opacity .12s;}
  .sb-resizer:hover::before, .sb-resizer.dragging::before, .sb-resizer:focus-visible::before{background:var(--accent);}
  .sb-resizer:hover::after, .sb-resizer.dragging::after, .sb-resizer:focus-visible::after{opacity:1;}
}
.brand{display:flex; align-items:center; gap:6px; padding:14px 10px 10px 12px;}
.brand-home{display:flex; align-items:center; gap:10px; flex:1; min-width:0; padding:6px; border:none; background:none; border-radius:var(--radius-sm); text-align:left; color:var(--text);}
.brand-home:hover{background:var(--surface-2);}
.brand-text{display:flex; flex-direction:column; min-width:0;}
.sb-toggle{flex:none; width:32px; height:32px; display:flex; align-items:center; justify-content:center; border:1px solid transparent; border-radius:8px; background:none; color:var(--text-faint);}
.sb-toggle:hover{background:var(--surface-2); color:var(--text); border-color:var(--border);}
.sb-toggle svg{width:18px; height:18px; transition:transform .15s;}
@media (min-width:881px){
  body.sb-collapsed{--sidebar-w:68px;}
  body.sb-collapsed .brand{flex-direction:column; padding:12px 6px 8px; gap:4px;}
  body.sb-collapsed .brand-home{flex:none; justify-content:center;}
  body.sb-collapsed .acct-txt, body.sb-collapsed .acct-caret{display:none;}
  body.sb-collapsed .learner-box{padding:8px 6px 10px;}
  body.sb-collapsed .acct-btn{justify-content:center; padding:6px 0;}
  .sidebar{z-index:35;}   /* sticky = own stacking layer; keep the account menu above the page */
  body.sb-collapsed .learner-box{margin-top:auto;}
  /* the collapsed rail is too narrow (and scrolls), so float the menu beside it */
  body.sb-collapsed .acct-menu{position:fixed; left:calc(var(--sidebar-w) + 8px); right:auto; bottom:12px; width:250px;}
  body.sb-collapsed .brand-text, body.sb-collapsed .sidebar-footer,
  body.sb-collapsed .nav-item > span, body.sb-collapsed .nav-kbd, body.sb-collapsed .nav-group-label{display:none;}
  body.sb-collapsed .sb-toggle svg{transform:scaleX(-1);}
  body.sb-collapsed .nav-item{justify-content:center; padding:10px 0;}
  body.sb-collapsed .nav{padding:6px 8px;}
}
.brand-mark{width:30px; height:26px; background:var(--logo) center/contain no-repeat; flex:none;}
.brand-mark svg{width:17px; height:17px;}
.brand-name{font-family:var(--font-display); font-weight:700; font-size:13.5px; letter-spacing:-0.01em; line-height:1.25;}
.brand-sub{font-size:10.5px; color:var(--text-faint); letter-spacing:.04em; text-transform:uppercase; margin-top:1px;}

/* account card, pinned to the bottom of the sidebar */
.learner-box{position:relative; padding:8px 10px 10px; border-top:1px solid var(--border);}
.learner-box:empty{display:none;}
.acct-btn{display:flex; align-items:center; gap:10px; width:100%; padding:7px 8px; border:1px solid transparent; border-radius:10px; background:none; color:var(--text); text-align:left;}
.acct-btn:hover, .acct-btn[aria-expanded="true"], .acct-btn.on{background:var(--surface-2); border-color:var(--border);}
.acc-av{flex:none; width:32px; height:32px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; background:var(--accent); color:var(--accent-text-on); font-weight:700; font-size:12.5px; letter-spacing:.02em;}
.acct-txt{display:flex; flex-direction:column; min-width:0; flex:1;}
.acct-name{font-weight:600; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.acct-sub{font-size:11.5px; color:var(--text-faint); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.acct-caret{flex:none; width:16px; height:16px; color:var(--text-faint); transition:transform .15s;}
.acct-btn[aria-expanded="true"] .acct-caret{transform:rotate(180deg);}
.acct-menu{position:absolute; left:10px; right:10px; bottom:calc(100% - 4px); z-index:80; background:var(--surface); border:1px solid var(--border); border-radius:12px; box-shadow:var(--shadow-lg); padding:6px; animation:acctIn .12s ease-out;}
@keyframes acctIn{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;}}
.acct-menu-head{display:flex; flex-direction:column; gap:2px; padding:8px 10px 10px; margin-bottom:4px; border-bottom:1px solid var(--border); font-size:12px; color:var(--text-muted); min-width:0;}
.acct-menu-head b{font-size:13.5px; color:var(--text);}
.acct-menu-head span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.acct-menu-head .acct-chip{white-space:normal; overflow:visible;}
.acct-chip{align-self:flex-start; max-width:100%; margin-top:6px; padding:3px 9px; border-radius:10px; line-height:1.4; background:var(--accent-soft); color:var(--accent-strong); font-size:11px; font-weight:600;}
.acct-item{display:flex; align-items:center; gap:10px; width:100%; padding:8px 10px; border:none; border-radius:8px; background:none; color:var(--text); font-size:13px; text-align:left; text-decoration:none;}
.acct-item:hover, .acct-item:focus-visible{background:var(--surface-2); outline:none;}
.acct-item svg{width:16px; height:16px; color:var(--text-muted);}
.acct-out{color:var(--danger);} .acct-out svg{color:var(--danger);}

.nav{padding:8px 10px; display:flex; flex-direction:column; gap:2px;}
.nav-primary{display:flex; flex-direction:column; gap:2px;}
.nav-group-label{font-size:10px; text-transform:uppercase; letter-spacing:.07em; color:var(--text-faint); padding:16px 10px 4px; margin-top:8px; border-top:1px solid var(--border);}
.nav-item{
  display:flex; align-items:center; gap:11px; padding:9px 10px; border-radius:var(--radius-sm);
  color:var(--text-muted); font-weight:500; font-size:13.5px; background:none; border:none; text-align:left; width:100%;
}
.nav-item svg{width:17px; height:17px; flex:none; opacity:.85;}
.nav-item:hover{background:var(--surface-2); color:var(--text);}
.nav-item.active{background:var(--accent-soft); color:var(--accent-strong); font-weight:600;}
.nav-item.active svg{opacity:1;}
.nav-kbd{margin-left:auto; font-size:10px; color:var(--text-faint); border:1px solid var(--border); border-radius:4px; padding:1px 5px; font-family:var(--font-mono);}
.nav-count{margin-left:auto; font-size:10.5px; color:var(--text-faint); font-variant-numeric:tabular-nums;}

.sidebar-section-label{font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-faint); padding:14px 14px 4px;}
.sidebar-footer{margin-top:auto; padding:12px 14px; border-top:1px solid var(--border); font-size:11px; color:var(--text-faint);}
.sidebar-footer .stat-row{display:flex; justify-content:space-between; padding:2px 0;}
.sidebar-footer b{color:var(--text-muted); font-variant-numeric:tabular-nums;}

.main{flex:1; min-width:0; display:flex; flex-direction:column;}
.topbar{
  position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:12px;
  padding:12px 24px; background:color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter:blur(8px);
  border-bottom:1px solid var(--border);
}
.topbar-title{font-family:var(--font-display); font-weight:600; font-size:16px; white-space:nowrap;}
.topbar-search{flex:1; max-width:420px; position:relative;}
.topbar-search input{width:100%;}
.topbar-actions{margin-left:auto; display:flex; gap:8px; align-items:center;}

.content{padding:24px; max-width:1180px; width:100%; margin:0 auto; flex:1;}
.content.wide{max-width:1360px;}

/* ---------- Inputs / buttons ---------- */
input[type="text"], input[type="search"], textarea, select{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm);
  padding:8px 12px; color:var(--text); width:100%;
}
input[type="text"]:focus, input[type="search"]:focus, textarea:focus, select:focus{border-color:var(--accent);}
textarea{resize:vertical; font-family:var(--font-mono); line-height:1.55; font-size:13px;}

.btn{
  display:inline-flex; align-items:center; gap:7px; padding:8px 14px; border-radius:var(--radius-sm);
  border:1px solid var(--border-strong); background:var(--surface); font-weight:500; font-size:13px; white-space:nowrap;
}
.btn:hover{background:var(--surface-2);}
.btn svg{width:15px; height:15px;}
.btn-primary{background:var(--accent); border-color:var(--accent); color:var(--accent-text-on);}
.btn-primary:hover{background:var(--accent-strong); border-color:var(--accent-strong);}
.btn-ghost{border-color:transparent; background:none;}
.btn-ghost:hover{background:var(--surface-2);}
.btn-sm{padding:5px 10px; font-size:12px;}
.btn-icon{padding:7px; width:32px; height:32px; justify-content:center;}
.btn[disabled]{opacity:.5; cursor:not-allowed;}
.btn-danger{color:var(--danger); border-color:var(--danger);}
.btn-danger:hover{background:var(--danger-soft);}
.btn-warn{color:var(--warn); border-color:var(--warn);}
.btn-warn:hover{background:var(--warn-soft);}

/* ---------- Admin: grouped sections + danger zone ----------
   Used by the Users/Prompts console drawers to separate normal controls from
   destructive ones instead of one flat row of same-weight buttons. */
.admin-section{border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px; background:var(--surface);}
.admin-section + .admin-section{margin-top:14px;}
.admin-section h3{font-size:12.5px; font-weight:600; margin:0 0 10px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.03em;}
.admin-help{font-size:11.5px; color:var(--text-faint); margin-top:6px; line-height:1.5;}
.admin-danger-zone{border:1px solid var(--danger); border-radius:var(--radius); padding:14px 16px; background:var(--danger-soft);}
.admin-danger-zone h3{display:flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600; margin:0 0 4px; color:var(--danger);}
.admin-danger-zone h3 svg{width:15px; height:15px; flex-shrink:0;}
.admin-danger-zone p{font-size:11.5px; color:var(--text-muted); margin:0 0 10px;}

/* ---------- Chips / badges ---------- */
.chip{display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:99px; font-size:11.5px; font-weight:500; border:1px solid var(--border); background:var(--surface-2); color:var(--text-muted); white-space:nowrap;}
.chip-accent{background:var(--accent-soft); color:var(--accent-strong); border-color:transparent;}
.chip-blue{background:var(--good-blue-soft); color:var(--good-blue); border-color:transparent;}
.chip-warn{background:var(--warn-soft); color:var(--warn); border-color:transparent;}
.badge-health{display:inline-flex; align-items:center; gap:5px; padding:2px 8px; border-radius:99px; font-size:11px; font-weight:600;}
.health-excellent{background:var(--accent-soft); color:var(--accent-strong);}
.health-good{background:var(--good-blue-soft); color:var(--good-blue);}
.health-needs{background:var(--warn-soft); color:var(--warn);}
.health-review{background:var(--danger-soft); color:var(--danger);}
.badge-health .dot{width:6px; height:6px; border-radius:50%; background:currentColor;}
.diff-dot{display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:600; color:var(--text-muted);}
.diff-dot i{width:7px; height:7px; border-radius:50%; display:inline-block;}
.diff-Beginner i{background:var(--accent);} .diff-Intermediate i{background:var(--good-blue);} .diff-Advanced i{background:var(--warn);}

.quality-pill{display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600; font-family:var(--font-mono);}
.quality-bar{width:38px; height:5px; border-radius:3px; background:var(--surface-2); overflow:hidden;}
.quality-bar > i{display:block; height:100%; border-radius:3px;}
.q-high i{background:var(--accent);} .q-mid i{background:var(--good-blue);} .q-low i{background:var(--warn);}
.q-high{color:var(--accent-strong);} .q-mid{color:var(--good-blue);} .q-low{color:var(--warn);}

/* ---------- Cards ---------- */
.prompt-card{
  display:flex; flex-direction:column; gap:6px; padding:14px 16px; border:1px solid var(--border); border-radius:var(--radius);
  background:var(--surface); cursor:pointer; position:relative;
}
.prompt-card:hover{border-color:var(--border-strong); box-shadow:var(--shadow);}
.prompt-card-top{display:flex; align-items:flex-start; gap:10px;}
.prompt-card-title{font-weight:600; font-size:14.5px; letter-spacing:-0.005em; flex:1; min-width:0;}
.prompt-card-desc{color:var(--text-muted); font-size:12.8px; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;}
.prompt-card-meta{display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-top:2px;}
.prompt-card-actions{display:flex; gap:4px; flex:none; align-items:center;}
.tmpl-glyph{font-family:var(--font-mono); font-size:12px; font-weight:600; color:var(--text-faint); padding:2px 4px; border:1px solid var(--border); border-radius:5px; line-height:1;}
.prompt-card.is-starter{background:var(--surface-2);}
.fav-btn{background:none; border:none; padding:5px; border-radius:6px; color:var(--text-faint); display:flex;}
.fav-btn:hover{background:var(--surface-2); color:var(--warn);}
.fav-btn.is-fav{color:var(--warn);}
.fav-btn svg{width:17px; height:17px;}
.result-count{color:var(--text-faint); font-size:12.5px; padding:2px 2px 10px;}

/* ---------- Home ---------- */
.hero{padding:34px 4px 22px; max-width:820px;}
.hero .greeting{font-size:13px; color:var(--text-muted); margin-bottom:8px;}
.hero h1{font-size:28px; letter-spacing:-0.015em; margin-bottom:16px;}
.search-hero{position:relative;}
.search-hero input{
  width:100%; padding:15px 48px 15px 46px; font-size:15px; border-radius:var(--radius-lg);
  border:1.5px solid var(--border-strong); box-shadow:var(--shadow);
}
.search-hero input:focus{border-color:var(--accent);}
.search-hero .icon-search{position:absolute; left:16px; top:50%; transform:translateY(-50%); width:19px; height:19px; color:var(--text-faint);}
.search-hero .icon-clear{position:absolute; right:14px; top:50%; transform:translateY(-50%); width:19px; height:19px; color:var(--text-faint); background:none; border:none; padding:2px;}
.search-examples{display:flex; flex-wrap:wrap; gap:7px; margin-top:12px;}
.search-example-chip{padding:5px 11px; border-radius:99px; font-size:12px; border:1px solid var(--border); background:var(--surface); color:var(--text-muted);}
.search-example-chip:hover{border-color:var(--accent); color:var(--accent-strong);}

.quick-actions{display:grid; grid-template-columns:repeat(6,1fr); gap:10px; margin:22px 0 30px; max-width:820px;}
.quick-action{display:flex; flex-direction:column; gap:8px; align-items:flex-start; padding:13px; border-radius:var(--radius); border:1px solid var(--border); background:var(--surface); text-align:left;}
.quick-action:hover{border-color:var(--accent); background:var(--accent-soft);}
.quick-action svg{width:18px; height:18px; color:var(--accent-strong);}
.quick-action-label{font-weight:600; font-size:12.5px;}

.goal-grid{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:32px;}
.goal-chip{padding:8px 15px; border-radius:99px; border:1px solid var(--border); background:var(--surface); font-weight:500; font-size:13px; display:flex; align-items:center; gap:7px;}
.goal-chip:hover{border-color:var(--accent-strong); background:var(--accent-soft); color:var(--accent-strong);}

.section-title{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:12px;}
.section-title h2{font-size:15.5px;}
.section-title a, .section-title button.linklike{font-size:12.5px; color:var(--accent-strong); background:none; border:none; font-weight:500;}

.home-row{display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px; margin-bottom:30px;}
.mini-list{display:flex; flex-direction:column; gap:4px;}
.mini-item{display:flex; align-items:center; gap:9px; padding:8px 10px; border-radius:var(--radius-sm); font-size:13px;}
.mini-item:hover{background:var(--surface-2);}
.mini-item-title{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.empty-mini{color:var(--text-faint); font-size:12.5px; padding:10px;}

.potd{display:flex; gap:16px; padding:18px 20px; border:1px solid var(--border); border-radius:var(--radius-lg); background:linear-gradient(150deg, var(--accent-soft), var(--surface) 70%); margin-bottom:30px; cursor:pointer;}
.potd:hover{border-color:var(--accent);}
.potd-badge{font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; font-weight:700; color:var(--accent-strong);}
.potd h3{font-size:16px; margin:6px 0 4px;}
.potd p{font-size:12.8px; color:var(--text-muted); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}

.rec-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:10px; margin-bottom:30px;}

/* ---------- Filters ---------- */
.filter-bar{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:16px; padding:12px 14px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);}
.filter-bar select{width:auto; padding:6px 10px; font-size:12.5px; border-radius:6px;}
.filter-bar .spacer{flex:1;}
.filter-tag{display:flex; align-items:center; gap:5px; padding:4px 8px 4px 10px; background:var(--accent-soft); color:var(--accent-strong); border-radius:99px; font-size:12px; font-weight:500;}
.filter-tag button{background:none; border:none; color:inherit; display:flex; padding:1px;}
.filter-tag button svg{width:12px; height:12px;}
.results-list{display:flex; flex-direction:column; gap:8px;}

/* ---------- Category grid ---------- */
.category-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:12px;}
.category-card{padding:16px; border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); display:flex; flex-direction:column; gap:6px; text-align:left;}
.category-card:hover{border-color:var(--accent); box-shadow:var(--shadow);}
.category-card-name{font-weight:600; font-size:13.8px;}
.category-card-count{font-size:12px; color:var(--text-faint);}
.category-card-bar{height:4px; border-radius:2px; background:var(--surface-2); overflow:hidden; margin-top:2px;}
.category-card-bar > i{display:block; height:100%; background:var(--accent);}

/* ---------- Task hubs: "what do you need to do?" front doors ---------- */
.task-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:10px;}
.task-tile{display:flex; align-items:flex-start; gap:11px; padding:13px 14px; border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); text-align:left; color:var(--text); transition:border-color .12s, box-shadow .12s, transform .12s;}
.task-tile:hover{border-color:var(--accent); box-shadow:var(--shadow); transform:translateY(-1px);}
.task-tile .tt-ico{flex:none; width:34px; height:34px; border-radius:9px; background:var(--accent-soft); display:flex; align-items:center; justify-content:center; font-size:17px; line-height:1;}
.task-tile .tt-body{min-width:0; display:flex; flex-direction:column; gap:2px;}
.task-tile .tt-label{font-weight:600; font-size:13.4px; line-height:1.3;}
.task-tile .tt-sub{font-size:11.8px; color:var(--text-faint);}
.task-grid-more{margin-top:10px;}
.task-block{margin:6px 0 30px;}
.task-block .section-title p{font-size:12.5px; color:var(--text-muted); margin:2px 0 0;}
/* results: what the search understood */
.intent-banner{display:flex; align-items:center; gap:12px; padding:12px 14px; margin:0 0 12px; border-radius:var(--radius); background:linear-gradient(120deg, var(--accent-soft), var(--surface) 80%); border:1px solid var(--border); cursor:pointer; text-align:left; width:100%; color:var(--text);}
.intent-banner:hover{border-color:var(--accent);}
.intent-banner .ib-ico{font-size:20px; line-height:1; flex:none;}
.intent-banner .ib-text{flex:1; min-width:0; font-size:13px;}
.intent-banner .ib-text b{display:block; font-size:13.6px; margin-bottom:1px;}
.intent-banner .ib-text span{color:var(--text-muted);}
.intent-banner .ib-go{font-size:12.5px; font-weight:600; color:var(--accent-strong); white-space:nowrap;}
.search-fix{font-size:12.5px; color:var(--text-muted); margin:-2px 0 10px;}
.search-fix b{color:var(--text);}
.search-fix button{background:none; border:none; padding:0; color:var(--accent-strong); font-weight:600; font-size:12.5px; text-decoration:underline;}
.empty-state .btn svg{width:15px; height:15px; margin:0; color:inherit;}
.chip-essential{background:var(--accent-soft); color:var(--accent-strong); border-color:transparent; font-weight:600;}
/* task toolkit page */
.hub-head{display:flex; gap:14px; align-items:flex-start; margin:4px 0 18px;}
.hub-head .hh-ico{flex:none; width:52px; height:52px; border-radius:14px; background:var(--accent-soft); display:flex; align-items:center; justify-content:center; font-size:26px;}
.hub-head h1{font-size:23px; letter-spacing:-0.01em; margin:2px 0 4px;}
.hub-head p{font-size:13.5px; color:var(--text-muted); max-width:640px;}
.hub-howto{display:flex; flex-wrap:wrap; gap:6px 16px; font-size:12.3px; color:var(--text-muted); padding:10px 14px; border:1px dashed var(--border-strong); border-radius:var(--radius); margin:0 0 20px;}
.hub-howto b{color:var(--text);}
.hub-others{display:flex; flex-wrap:wrap; gap:7px; margin-top:8px;}

/* ---------- Library shell: left rail + main ---------- */
.content.content-lib{max-width:1440px; padding:0;}
.lib-shell{position:relative; display:grid; grid-template-columns:var(--rail-w,260px) minmax(0,1fr); min-height:calc(100vh - 60px);}
.lib-rail{position:sticky; top:60px; align-self:start; height:calc(100vh - 60px); overflow-y:auto; padding:18px 12px 28px 14px; border-right:1px solid var(--border); background:var(--surface);}
.rail-find{position:relative; margin:0 2px 12px;}
.rail-find .rf-ico{position:absolute; left:11px; top:50%; transform:translateY(-50%); width:15px; height:15px; color:var(--text-faint);}
.rail-find input{width:100%; padding:9px 10px 9px 33px; font-size:13px; border-radius:var(--radius);}
.rail-label{font-size:10.5px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--text-faint); margin:18px 10px 6px;}
.rail-item{display:flex; align-items:center; gap:10px; width:100%; padding:8px 10px; border:none; background:none; border-radius:var(--radius-sm); text-align:left; color:var(--text); font-size:13.4px;}
.rail-item:hover{background:var(--surface-2);}
.rail-item.active{background:var(--accent-soft); color:var(--accent-strong); font-weight:600;}
.rail-item .ri-ico{width:20px; text-align:center; font-size:14px; flex:none;}
.rail-item .ri-label{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.rail-item .ri-count{font-size:11px; color:var(--text-faint); font-variant-numeric:tabular-nums;}
.rail-item.active .ri-count{color:var(--accent-strong);}
.rail-empty{font-size:12.5px; color:var(--text-faint); padding:10px;}
.lib-main{padding:26px 32px 40px; min-width:0;}
.lib-chips{display:none;}
/* drag-to-resize edge of the rail */
.rail-resizer{position:absolute; top:0; bottom:0; left:calc(var(--rail-w,260px) - 5px); width:10px; z-index:6; cursor:col-resize; touch-action:none; outline:none;}
.rail-resizer::before{content:""; position:absolute; top:0; bottom:0; left:4px; width:2px; background:transparent; transition:background .12s;}
.rail-resizer::after{content:""; position:sticky; top:45vh; display:block; margin-left:1px; width:8px; height:40px; border-radius:6px; background:var(--border-strong); opacity:0; transition:opacity .12s;}
.rail-resizer:hover::before, .rail-resizer.dragging::before, .rail-resizer:focus-visible::before{background:var(--accent);}
.rail-resizer:hover::after, .rail-resizer.dragging::after, .rail-resizer:focus-visible::after{opacity:1; background:var(--accent);}
body.is-resizing, body.is-resizing *{cursor:col-resize !important; user-select:none !important;}
.lib-shell.rail-closed .lib-rail{visibility:hidden; padding:0; border:0; overflow:hidden;}
.lib-shell.rail-closed .rail-resizer{left:0;}
.rail-open{display:none;}
.lib-shell.rail-closed .rail-open{display:flex; align-items:center; gap:4px; position:absolute; left:0; top:22px; z-index:7; padding:8px 10px 8px 6px; border:1px solid var(--border); border-left:none; border-radius:0 10px 10px 0; background:var(--surface); color:var(--accent-strong); font-size:12.5px; font-weight:600; box-shadow:var(--shadow);}
.rail-open svg{width:15px; height:15px;}
.lib-shell.rail-closed .lib-main{padding-left:92px;}
/* search: highlights, pinned pick, tips */
.pt-title mark, .pt-desc mark, .prompt-card-title mark, .prompt-card-desc mark, .sg-main mark{background:none; color:inherit; font-weight:800; box-shadow:inset 0 -0.42em 0 var(--accent-soft);}
.pt-pin{display:inline-flex; align-self:flex-start; margin:-4px 0 8px; padding:2px 9px; border-radius:99px; background:var(--accent); color:var(--accent-text-on); font-size:11px; font-weight:700; letter-spacing:.02em;}
.prompt-card-title .pt-pin{margin:0 6px 0 0; vertical-align:2px;}
.prompt-card.is-pinned{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft);}
.sg-head{display:flex; align-items:center; justify-content:space-between;}
.sg-clear{background:none; border:none; padding:0; font-size:11px; font-weight:600; color:var(--accent-strong); letter-spacing:0; text-transform:none;}
.sg-tip{font-size:11.5px; color:var(--text-faint); padding:8px 10px 4px; border-top:1px solid var(--border); margin-top:4px; line-height:1.7;}
.sg-tip code{font-family:var(--font-mono); font-size:11px; padding:1px 5px; border-radius:5px; background:var(--surface-2); color:var(--text-muted);}
.search-ops{display:flex; flex-wrap:wrap; align-items:center; gap:6px; font-size:12.5px; color:var(--text-muted); margin:0 0 14px;}
.lib-head{display:flex; align-items:center; justify-content:space-between; gap:20px; flex-wrap:wrap;}
.lh-title{display:flex; align-items:center; gap:14px; min-width:0;}
.lh-ico{flex:none; width:48px; height:48px; border-radius:13px; background:var(--accent-soft); display:flex; align-items:center; justify-content:center; font-size:24px;}
.lh-title h1{font-size:28px; letter-spacing:-0.02em; line-height:1.15;}
.lh-sub{font-size:13px; color:var(--text-muted); margin-top:3px;}
.lh-tools{display:flex; align-items:center; gap:10px; flex:1; justify-content:flex-end; min-width:280px;}
.lib-search{position:relative; flex:1; max-width:520px;}
.lib-search .ls-ico{position:absolute; left:14px; top:50%; transform:translateY(-50%); width:17px; height:17px; color:var(--text-faint);}
.lib-search input{width:100%; padding:11px 38px 11px 40px; font-size:14px; border-radius:var(--radius);}
.lib-search .ls-clear{position:absolute; right:10px; top:50%; transform:translateY(-50%); background:none; border:none; color:var(--text-faint); padding:3px; display:flex;}
.lib-search .ls-clear svg{width:16px; height:16px;}
.layout-toggle{display:flex; gap:6px;}
.layout-toggle button{width:42px; height:42px; display:flex; align-items:center; justify-content:center; border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); color:var(--text-muted);}
.layout-toggle button svg{width:19px; height:19px;}
.layout-toggle button.on{border-color:var(--accent); background:var(--accent-soft); color:var(--accent-strong);}
.lh-blurb{font-size:13.5px; color:var(--text-muted); margin:10px 0 18px; max-width:720px;}
.lib-tabbar{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:18px;}
.lib-tabs{display:inline-flex; gap:4px; padding:4px; border-radius:12px; background:var(--surface-2);}
.lib-tabs button{padding:8px 16px; border:none; border-radius:9px; background:none; font-size:13.5px; font-weight:500; color:var(--text-muted);}
.lib-tabs button:hover{color:var(--text);}
.lib-tabs button.on{background:var(--accent); color:var(--accent-text-on); font-weight:600; box-shadow:var(--shadow);}
.lib-tab-actions{display:flex; gap:6px;}
.lib-tab-actions svg{width:15px; height:15px;}
.lf-dot{width:7px; height:7px; border-radius:50%; background:var(--accent); display:inline-block; margin-left:2px;}
.lib-filters{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:-6px 0 18px; padding:10px 12px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);}
.lib-filters[hidden]{display:none;}
.lib-filters select{width:auto; padding:6px 10px; font-size:12.5px;}
.lib-filters .spacer{flex:1;}
.lib-section{margin-bottom:28px;}
.st-note{font-size:12px; color:var(--text-faint);}
/* search-first header */
.lib-searchbar{display:flex; gap:10px; align-items:center; margin-bottom:16px;}
.lib-searchbar .lib-search{flex:1; max-width:none; position:relative;}
.lib-searchbar .lib-search input{padding:16px 44px 16px 50px; font-size:16px; border-radius:14px; border:1.5px solid var(--border-strong); box-shadow:var(--shadow);}
.lib-searchbar .lib-search input:focus{border-color:var(--accent); box-shadow:0 0 0 4px var(--accent-soft);}
.lib-searchbar .ls-ico{left:18px; width:20px; height:20px;}
.lib-searchbar .layout-toggle button{width:52px; height:52px; border-radius:12px;}
.lib-crumb{display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:12.5px; color:var(--text-faint); margin:0 0 10px;}
.lib-crumb .lc-link{background:none; border:none; padding:0; color:var(--accent-strong); font-weight:600; font-size:12.5px;}
.lib-crumb .lc-current{display:inline-flex; align-items:center; gap:6px; padding:4px 6px 4px 11px; border-radius:99px; background:var(--accent-soft); color:var(--accent-strong); font-weight:700; font-size:13px;}
.lib-crumb .lc-clear{display:flex; background:none; border:none; padding:3px; border-radius:50%; color:inherit;}
.lib-crumb .lc-clear:hover{background:var(--surface);}
.lib-crumb .lc-clear svg{width:13px; height:13px;}
.lh-sub #lib-count{font-weight:600; color:var(--text);}
.section-title h2 small{font-size:12px; font-weight:600; color:var(--text-faint); margin-left:6px;}
.empty-inline{display:flex; flex-direction:column; gap:3px; padding:16px 18px; border:1px dashed var(--border-strong); border-radius:var(--radius); font-size:13px; color:var(--text-muted);}
.empty-inline b{color:var(--text); font-size:14px;}
.build-own{display:flex; align-items:center; gap:14px; padding:16px 18px; margin:6px 0 24px; border:1px solid var(--accent); border-radius:var(--radius-lg); background:linear-gradient(120deg, var(--accent-soft), var(--surface) 75%);}
.build-own .bo-ico{font-size:26px; flex:none;}
.build-own .bo-text{flex:1; min-width:0; display:flex; flex-direction:column; gap:3px; font-size:13px; color:var(--text-muted);}
.build-own .bo-text b{color:var(--text); font-size:14.5px;}
.build-own .btn svg{width:15px; height:15px;}
/* type-ahead */
.suggest-panel{position:absolute; left:0; right:0; top:calc(100% + 6px); z-index:40; background:var(--surface); border:1px solid var(--border-strong); border-radius:14px; box-shadow:var(--shadow-lg); padding:6px; max-height:min(460px, 70vh); overflow-y:auto; text-align:left;}
.search-hero .suggest-panel{top:calc(100% + 6px);}
.sg-head{font-size:10.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--text-faint); padding:8px 10px 4px;}
.sg-item{display:flex; align-items:center; gap:10px; width:100%; padding:8px 10px; border:none; background:none; border-radius:9px; text-align:left; color:var(--text);}
.sg-item:hover, .sg-item.on{background:var(--accent-soft);}
.sg-ico{width:30px; height:30px; flex:none; border-radius:8px; background:var(--surface-2); display:flex; align-items:center; justify-content:center; font-size:15px;}
.sg-main{display:flex; flex-direction:column; min-width:0;}
.sg-main b{font-size:13.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.sg-main small{font-size:11.5px; color:var(--text-faint);}
.sg-build{border-top:1px solid var(--border); border-radius:0 0 9px 9px; margin-top:4px;}
.rail-label{display:flex; flex-direction:column; gap:1px; font-size:11.5px; color:var(--text); letter-spacing:.07em; margin:20px 10px 6px;}
.rail-label small{font-size:11px; font-weight:500; letter-spacing:0; text-transform:none; color:var(--text-faint);}
.rail-item.active{box-shadow:inset 3px 0 0 var(--accent);}
/* detail: similar prompts */
.similar-list{display:flex; flex-direction:column; gap:6px;}
.similar-item{display:flex; align-items:center; gap:10px; width:100%; padding:9px 12px; border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); text-align:left; color:var(--text);}
.similar-item:hover{border-color:var(--accent); background:var(--accent-soft);}
.similar-item .si-ico{width:30px; height:30px; flex:none; border-radius:8px; background:var(--accent-soft); display:flex; align-items:center; justify-content:center;}
.similar-item .si-main{flex:1; min-width:0; display:flex; flex-direction:column;}
.similar-item .si-main b{font-size:13px; font-weight:600;}
.similar-item .si-main small{font-size:11.5px; color:var(--text-faint);}
.similar-item > svg{width:15px; height:15px; color:var(--text-faint); flex:none;}
.builder-seed{padding:10px 12px; margin:0 0 12px; border-radius:var(--radius); background:var(--accent-soft); color:var(--accent-strong); font-size:13px;}
/* prompt tiles */
.tile-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:16px;}
.prompt-card.prompt-tile{padding:20px; gap:0; border-radius:var(--radius-lg); min-height:208px; transition:border-color .12s, box-shadow .12s, transform .12s;}
.prompt-card.prompt-tile:hover{border-color:var(--accent); box-shadow:var(--shadow); transform:translateY(-2px);}
.pt-top{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:14px;}
.pt-ico{width:46px; height:46px; border-radius:12px; background:var(--accent-soft); display:flex; align-items:center; justify-content:center; font-size:22px;}
.pt-fav{width:36px; height:36px; border-radius:50%; border:1px solid var(--border) !important; display:flex; align-items:center; justify-content:center;}
.pt-title{font-size:16px; font-weight:700; line-height:1.3; letter-spacing:-0.01em; margin-bottom:7px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
.pt-desc{font-size:13px; color:var(--text-muted); line-height:1.5; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; margin-bottom:14px;}
.pt-meta{display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-top:auto;}
.pt-fill{font-family:var(--font-mono); font-size:11px; color:var(--text-faint);}
@media (max-width:880px){
  .content.content-lib{padding:0;}
  .lib-shell{grid-template-columns:1fr;}
  .lib-rail, .rail-resizer, .lib-shell .rail-open{display:none !important;}
  .lib-shell.rail-closed .lib-main{padding-left:16px;}
  .lib-main{padding:10px 16px 32px;}
  .lib-chips{display:flex; gap:8px; overflow-x:auto; margin:0 -16px 12px; padding:2px 16px 6px; scroll-snap-type:x proximity; scrollbar-width:none; -webkit-overflow-scrolling:touch;}
  .lib-chips::-webkit-scrollbar{display:none;}
  .lc-chip{flex:none; display:inline-flex; align-items:center; gap:6px; min-height:38px; padding:0 14px; border:1px solid var(--border); border-radius:99px; background:var(--surface); color:var(--text); font-size:13.5px; font-weight:500; white-space:nowrap; scroll-snap-align:start;}
  .lc-chip.on{background:var(--accent); border-color:var(--accent); color:var(--accent-text-on); font-weight:600;}
  .lc-sep{flex:none; width:1px; margin:6px 2px; background:var(--border-strong);}
  .lib-searchbar{position:sticky; top:0; z-index:25; margin:0 -16px 10px; padding:8px 16px; background:var(--bg);}
  .lib-searchbar .lib-search input{font-size:16px !important;} /* 16px stops iOS zoom on focus */
  .suggest-panel{max-height:62vh; border-radius:12px;}
  .sg-item{padding:10px; min-height:48px;}
  .sg-tip{display:none;}
  .lib-tabbar{gap:8px;}
  .lib-tabs{max-width:100%; overflow-x:auto; scrollbar-width:none;}
  .lib-tab-actions{width:100%;}
  .lib-tab-actions .btn{flex:1; justify-content:center; min-height:40px;}
  .lib-filters select{flex:1 1 45%;}
  .lib-crumb{margin-bottom:8px;}
  .pt-fav{width:40px; height:40px;}
  /* compact tiles: icon beside the title, two-line description */
  .prompt-card.prompt-tile{display:grid; grid-template-columns:40px minmax(0,1fr) 40px; column-gap:12px; row-gap:4px; padding:14px;}
  .prompt-tile .pt-top{display:contents;}
  .prompt-tile .pt-ico{grid-column:1; grid-row:1 / span 2; width:40px; height:40px; font-size:19px; border-radius:10px;}
  .prompt-tile .pt-fav{grid-column:3; grid-row:1; align-self:start;}
  .prompt-tile .pt-pin{grid-column:2; grid-row:1; margin:0 0 2px;}
  .prompt-tile .pt-title{grid-column:2; font-size:15px; margin:0;}
  .prompt-tile .pt-desc{grid-column:2 / span 2; -webkit-line-clamp:2; margin:2px 0 8px;}
  .prompt-tile .pt-meta{grid-column:1 / span 3;}
  .lh-title h1{font-size:22px;}
  .lh-ico{width:40px; height:40px; font-size:20px;}
  .lib-head{flex-direction:column; align-items:stretch; gap:12px;}
  .lib-searchbar .lib-search input{padding:13px 40px 13px 44px; font-size:15px;}
  .lib-searchbar .layout-toggle{display:none;}
  .build-own{flex-direction:column; align-items:flex-start;}
  .lh-tools{min-width:0; width:100%; flex:none;}
  .st-note{display:none;}
  .lib-search{max-width:none;}
  .layout-toggle button{width:40px; height:40px;}
  .lib-tabs button{padding:7px 11px; font-size:12.8px;}
  .tile-grid{grid-template-columns:1fr; gap:10px;}
  .prompt-card.prompt-tile{min-height:0; padding:16px;}
}

/* ---------- Program / Learn / Practice ---------- */
.program-header{padding:18px 20px; border:1px solid var(--border); border-radius:var(--radius-lg); background:var(--surface); margin-bottom:20px;}
.program-header h2{font-size:18px; margin-bottom:4px;}
.program-header .ph-path{font-size:12px; color:var(--text-faint); margin-bottom:10px;}
.program-header .ph-desc{font-size:13px; color:var(--text-muted);}
.progress-track{height:8px; border-radius:4px; background:var(--surface-2); overflow:hidden; margin-top:12px;}
.progress-track > i{display:block; height:100%; background:var(--accent);}

.module-card{border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); margin-bottom:12px; overflow:hidden;}
.module-head{display:flex; align-items:center; gap:12px; padding:14px 16px; cursor:pointer;}
.module-head:hover{background:var(--surface-2);}
.module-num{width:26px; height:26px; border-radius:7px; background:var(--accent-soft); color:var(--accent-strong); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:12px; flex:none;}
.module-title{font-weight:600; font-size:13.8px; flex:1;}
.module-body{padding:4px 16px 14px; border-top:1px solid var(--border);}

.lesson-card{border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); padding:18px 20px; margin-bottom:14px;}
.lesson-card h3{font-size:15px; margin-bottom:4px;}
.lesson-card .lesson-principle{font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--accent-strong); font-weight:700; margin-bottom:8px;}
.lesson-card .lesson-text{font-size:13.2px; color:var(--text-muted); line-height:1.6; margin-bottom:12px;}

.rubric{display:flex; flex-direction:column; gap:10px; margin:14px 0;}
.rubric-row{display:grid; grid-template-columns:120px 1fr 42px; gap:10px; align-items:center; font-size:12.5px;}
.rubric-row .rl{color:var(--text-muted); font-weight:600;}
.rubric-row .rt{height:7px; border-radius:4px; background:var(--surface-2); overflow:hidden;}
.rubric-row .rt > i{display:block; height:100%;}
.rubric-row .rv{text-align:right; font-family:var(--font-mono); color:var(--text-muted);}
.rubric-note{font-size:12px; color:var(--text-muted); grid-column:1/-1; margin-top:-4px; padding-left:130px;}
.scenario-card{border:1px solid var(--border); border-radius:var(--radius); background:var(--surface-2); padding:16px 18px; margin-bottom:14px;}
.scenario-card .sc-role{font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-faint); font-weight:700;}
.scenario-card h3{font-size:15px; margin:4px 0 8px;}
.scenario-card p{font-size:13px; color:var(--text-muted); line-height:1.6;}

/* ---------- Drawer ---------- */
.overlay{position:fixed; inset:0; background:rgba(10,14,15,0.4); z-index:50; opacity:0; pointer-events:none; transition:opacity .15s ease;}
.overlay.show{opacity:1; pointer-events:auto;}
.drawer{
  position:fixed; top:0; right:0; height:100vh; width:min(640px,92vw); background:var(--surface); z-index:51;
  box-shadow:var(--shadow-lg); transform:translateX(100%); transition:transform .2s ease; display:flex; flex-direction:column;
  border-left:1px solid var(--border);
}
.drawer.show{transform:translateX(0);}
.drawer-header{display:flex; align-items:flex-start; gap:10px; padding:18px 20px 14px; border-bottom:1px solid var(--border);}
.drawer-header h2{font-size:17px; flex:1; min-width:0;}
.drawer-body{flex:1; overflow-y:auto; padding:18px 20px 40px;}
.drawer-close{background:none; border:none; padding:6px; border-radius:6px; color:var(--text-faint); flex:none;}
.drawer-close:hover{background:var(--surface-2);}
.drawer-close svg{width:19px; height:19px;}

.detail-meta-row{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:16px; align-items:center;}
.detail-section{margin-bottom:22px;}
.detail-section h3{font-size:11.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-faint); margin-bottom:8px; font-family:var(--font-body); font-weight:600;}
.prose{font-size:13.6px; color:var(--text); line-height:1.6;}
.prose ul{margin:6px 0 0; padding-left:18px;}
.prose li{margin-bottom:4px;}
.prompt-block{background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px; font-family:var(--font-mono); font-size:12.8px; line-height:1.65; white-space:pre-wrap; word-break:break-word; max-height:340px; overflow-y:auto;}
.block-header{display:flex; align-items:center; gap:8px; margin-bottom:8px; flex-wrap:wrap;}
.block-header .label{font-weight:600; font-size:12.5px;}
.layer-tabs{display:flex; gap:4px; margin-bottom:8px;}
.layer-tab{padding:5px 10px; font-size:11.5px; font-weight:600; border-radius:99px; border:1px solid var(--border); background:var(--surface); color:var(--text-muted);}
.layer-tab.active{background:var(--accent-soft); color:var(--accent-strong); border-color:transparent;}
.quality-breakdown{display:grid; grid-template-columns:1fr 1fr; gap:8px 16px;}
.qb-row{display:flex; align-items:center; gap:8px; font-size:12px;}
.qb-row .qb-label{width:96px; color:var(--text-muted); flex:none;}
.qb-row .qb-bar{flex:1; height:5px; border-radius:3px; background:var(--surface-2); overflow:hidden;}
.qb-row .qb-bar > i{display:block; height:100%; background:var(--accent);}
.qb-row .qb-val{width:26px; text-align:right; font-family:var(--font-mono); color:var(--text-muted);}
.strengths-improvements{display:flex; flex-direction:column; gap:5px; font-size:12.8px;}
.si-item{display:flex; gap:7px; align-items:flex-start;}
.si-item svg{width:14px; height:14px; margin-top:2px; flex:none;}
.si-good svg{color:var(--accent);} .si-bad svg{color:var(--warn);}
.var-list{display:flex; flex-wrap:wrap; gap:6px;}
.var-chip{font-family:var(--font-mono); font-size:11.5px; padding:3px 8px; border-radius:6px; background:var(--accent-soft); color:var(--accent-strong);}
.provenance{font-size:11.5px; color:var(--text-faint); display:flex; align-items:center; gap:6px; margin-top:4px;}
.related-grid{display:flex; flex-direction:column; gap:6px;}
.sensitive-note{display:flex; gap:8px; padding:10px 12px; border-radius:var(--radius-sm); background:var(--warn-soft); color:var(--warn); font-size:12px; align-items:flex-start; margin-bottom:14px;}
.sensitive-note svg{width:16px; height:16px; flex:none; margin-top:1px;}
.why-list{display:flex; flex-direction:column; gap:6px;}
.why-list .why-item{display:flex; gap:8px; font-size:13px; color:var(--text); line-height:1.55;}
.why-list .why-item svg{width:15px; height:15px; color:var(--accent); flex:none; margin-top:2px;}

.form-field{margin-bottom:14px;}
.form-field label{display:block; font-size:12.5px; font-weight:600; margin-bottom:5px; color:var(--text-muted);}
.form-hint{font-size:11.5px; color:var(--text-faint); margin-top:4px;}

/* ---------- Modal ---------- */
.modal{position:fixed; inset:0; z-index:60; display:flex; align-items:center; justify-content:center; padding:20px;}
.modal-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); box-shadow:var(--shadow-lg); width:min(640px,100%); max-height:88vh; overflow-y:auto; padding:22px 24px;}
.modal-header{display:flex; align-items:center; gap:10px; margin-bottom:16px;}
.modal-header h2{font-size:16px; flex:1;}

/* ---------- Builder ---------- */
.builder-steps{display:flex; gap:6px; margin-bottom:22px;}
.builder-step-dot{flex:1; height:4px; border-radius:2px; background:var(--surface-2);}
.builder-step-dot.done{background:var(--accent);}
.builder-step-dot.active{background:var(--good-blue);}
.builder-card{max-width:660px; padding:22px 0;}
.builder-question{font-size:18px; font-family:var(--font-display); font-weight:600; margin-bottom:6px;}
.builder-nav{display:flex; justify-content:space-between; margin-top:20px;}

/* ---------- Insights ---------- */
.stat-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:24px;}
.stat-tile{padding:16px; border-radius:var(--radius); border:1px solid var(--border); background:var(--surface);}
.stat-tile .num{font-family:var(--font-mono); font-size:26px; font-weight:600; letter-spacing:-0.01em;}
.stat-tile .label{font-size:12px; color:var(--text-muted); margin-top:2px;}
.tabs{display:flex; gap:4px; border-bottom:1px solid var(--border); margin-bottom:18px; flex-wrap:wrap;}
.tab-btn{padding:9px 4px; margin-right:16px; background:none; border:none; border-bottom:2px solid transparent; color:var(--text-muted); font-weight:500; font-size:13.5px;}
.tab-btn.active{color:var(--text); border-color:var(--accent); font-weight:600;}
.bar-row{display:flex; align-items:center; gap:10px; font-size:12.8px; margin-bottom:7px;}
.bar-row .bar-label{width:190px; flex:none; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--text-muted);}
.bar-row .bar-track{flex:1; height:8px; border-radius:4px; background:var(--surface-2); overflow:hidden;}
.bar-row .bar-track > i{display:block; height:100%; background:var(--accent);}
.bar-row .bar-val{width:40px; text-align:right; font-family:var(--font-mono); color:var(--text-muted);}
.dup-group{border:1px solid var(--border); border-radius:var(--radius); padding:12px 14px; margin-bottom:10px;}
.dup-group-head{display:flex; align-items:center; gap:8px; margin-bottom:8px; font-size:12.5px; color:var(--text-muted); font-weight:600;}
.lifecycle-legend{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px;}
.lc-badge{display:inline-flex; align-items:center; gap:6px; padding:3px 10px; border-radius:99px; font-size:11.5px; font-weight:600;}
.lc-Draft{background:var(--surface-2); color:var(--text-muted);}
.lc-Review{background:var(--danger-soft); color:var(--danger);}
.lc-Curated{background:var(--good-blue-soft); color:var(--good-blue);}
.lc-Recommended{background:var(--accent-soft); color:var(--accent-strong);}
.lc-Archived{background:var(--surface-2); color:var(--text-faint);}

/* ---------- Empty / misc ---------- */
.empty-state{display:flex; flex-direction:column; align-items:center; text-align:center; padding:56px 20px; color:var(--text-muted); gap:10px;}
.empty-state svg{width:40px; height:40px; color:var(--text-faint); margin-bottom:4px;}
.empty-state h3{font-size:15px; color:var(--text);}
.skel{background:linear-gradient(90deg,var(--surface-2) 25%,var(--surface-hover) 37%,var(--surface-2) 63%); background-size:400% 100%; animation:skel 1.4s ease infinite; border-radius:6px;}
@keyframes skel{0%{background-position:100% 50%;}100%{background-position:0 50%;}}
.toast{position:fixed; bottom:22px; left:50%; transform:translate(-50%,12px); background:var(--text); color:var(--bg); padding:10px 18px; border-radius:99px; font-size:13px; font-weight:500; opacity:0; pointer-events:none; transition:all .18s ease; z-index:100; box-shadow:var(--shadow-lg);}
.toast-show{opacity:1; transform:translate(-50%,0);}
.mobile-nav{display:none;}
.mobile-topbar{display:none;}

@media (max-width:980px){
  .quick-actions{grid-template-columns:repeat(3,1fr);}
}
@media (max-width:880px){
  .sidebar{position:fixed; left:-280px; z-index:70; transition:left .18s ease; box-shadow:var(--shadow-lg);}
  .sidebar.open{left:0;}
  .quick-actions{grid-template-columns:repeat(2,1fr);}
  .home-row{grid-template-columns:1fr;}
  .content{padding:14px;}
  .topbar{padding:10px 14px; flex-wrap:wrap;}
  .topbar-title{order:1;}
  .topbar-actions{order:2; margin-left:0;}
  .topbar-search{order:3; flex-basis:100%; max-width:100%;}
  .hero h1{font-size:22px;}
  .drawer{width:100vw;}
  .mobile-topbar{display:flex; align-items:center; gap:10px;}
  .stat-grid{grid-template-columns:repeat(2,1fr);}
  .bar-row .bar-label{width:120px;}
  .rubric-row{grid-template-columns:100px 1fr 38px;}
  .rubric-note{padding-left:0;}
  .me-grid{grid-template-columns:1fr;}
  .home-cols{grid-template-columns:1fr;}
}
@media (max-width:640px){
  .starter-strip{grid-auto-flow:column; grid-auto-columns:78%; grid-template-columns:none;
    overflow-x:auto; scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch; padding-bottom:4px;}
  .starter-strip .prompt-card{scroll-snap-align:start;}
}
@media (max-width:400px){
  .category-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px;}
  .task-grid{grid-template-columns:1fr 1fr; gap:8px;}
  .task-tile{padding:11px; gap:9px;}
  .task-tile .tt-ico{width:30px; height:30px; font-size:15px;}
  .task-tile .tt-sub{display:none;}
  .intent-banner .ib-go{display:none;}
  .search-examples .search-example-chip:nth-child(n+4){display:none;}
}

/* ---------- Home (premium, low-load) ---------- */
.content-home{max-width:1120px;}
.h2-hero{position:relative; text-align:center; padding:52px 8px 8px; isolation:isolate;}
.h2-hero::before{content:""; position:absolute; z-index:-1; left:50%; top:0; width:min(760px,100%); height:300px; transform:translateX(-50%);
  background:radial-gradient(closest-side, var(--accent-soft), transparent); opacity:.9; pointer-events:none;}
.h2-hero-compact{padding-top:22px; text-align:left;}
.h2-hero-compact::before{display:none;}
.h2-greet{font-size:13.5px; font-weight:600; color:var(--accent-strong); letter-spacing:.01em; margin-bottom:12px;}
.h2-greet span{color:var(--text-faint); font-weight:500;}
.h2-hero h1{font-family:var(--font-display); font-size:40px; line-height:1.12; letter-spacing:-0.03em; font-weight:700; margin:0 0 12px;}
.h2-hero-compact h1{font-size:26px;}
.h2-lead{font-size:15.5px; color:var(--text-muted); max-width:540px; margin:0 auto 26px; line-height:1.55;}
.h2-search{max-width:720px; margin:0 auto;}
.h2-hero-compact .h2-search{margin:0; max-width:none;}
.h2-search input{height:60px; padding:0 96px 0 54px !important; font-size:16.5px !important; border-radius:18px !important; border:1px solid var(--border-strong) !important;
  background:var(--surface) !important; box-shadow:0 10px 30px rgba(20,24,26,.08), 0 1px 3px rgba(20,24,26,.06);}
.h2-search input:focus{border-color:var(--accent) !important; box-shadow:0 0 0 4px var(--accent-soft), 0 10px 30px rgba(20,24,26,.08);}
.h2-search .icon-search{left:20px !important; width:21px !important; height:21px !important;}
.h2-kbd{position:absolute; right:14px; top:50%; transform:translateY(-50%); font-family:var(--font-mono); font-size:11px; color:var(--text-faint); border:1px solid var(--border); border-bottom-width:2px; border-radius:6px; padding:3px 7px; background:var(--surface-2); pointer-events:none;}
.h2-try{display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:6px 8px; margin-top:16px; font-size:13px; color:var(--text-faint);}
.h2-try button{border:none; background:none; padding:4px 2px; color:var(--text-muted); font-size:13px; text-decoration:underline; text-decoration-color:var(--border-strong); text-underline-offset:3px;}
.h2-try button:hover{color:var(--accent-strong); text-decoration-color:var(--accent);}
.h2-try button + button::before{content:"·"; margin-right:8px; color:var(--border-strong); display:inline-block; text-decoration:none;}
.h2-section{margin-top:52px;}
.h2-head{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:16px; flex-wrap:wrap;}
.h2-head h2{font-family:var(--font-display); font-size:19px; letter-spacing:-0.015em; font-weight:650; margin:0;}
.h2-head p{font-size:13.5px; color:var(--text-muted); margin:4px 0 0;}
.h2-seg{display:inline-flex; padding:4px; gap:2px; border-radius:12px; background:var(--surface-2); border:1px solid var(--border);}
.h2-seg button{border:none; background:none; padding:8px 16px; border-radius:9px; font-size:13.5px; font-weight:600; color:var(--text-muted);}
.h2-seg button[aria-selected="true"]{background:var(--surface); color:var(--text); box-shadow:var(--shadow);}
.h2-grid{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px;}
.h2-tile, .h2-cont, .h2-recent{display:flex; align-items:center; gap:14px; width:100%; padding:18px; border:1px solid var(--border); border-radius:16px; background:var(--surface);
  text-align:left; color:var(--text); transition:border-color .15s, box-shadow .15s, transform .15s;}
.h2-tile:hover, .h2-cont:hover, .h2-recent:hover{border-color:var(--accent); box-shadow:0 8px 24px rgba(14,124,107,.10); transform:translateY(-2px);}
.h2-tile:focus-visible, .h2-cont:focus-visible, .h2-recent:focus-visible{outline:none; box-shadow:0 0 0 3px var(--accent-soft); border-color:var(--accent);}
.h2-ico{flex:none; width:46px; height:46px; border-radius:14px; background:var(--accent-soft); display:flex; align-items:center; justify-content:center; font-size:22px; line-height:1;}
.h2-ico-sm{width:38px; height:38px; border-radius:11px; font-size:18px;}
.h2-tbody{flex:1; min-width:0; display:flex; flex-direction:column; gap:3px;}
.h2-tlabel{font-weight:650; font-size:14.5px; line-height:1.3; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;}
.h2-tsub{font-size:12.5px; color:var(--text-faint); line-height:1.4; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.h2-kicker{font-size:11px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--accent-strong);}
.h2-arrow{flex:none; color:var(--text-faint); opacity:0; transform:translateX(-4px); transition:opacity .15s, transform .15s; display:flex;}
.h2-arrow svg{width:16px; height:16px;}
.h2-tile:hover .h2-arrow, .h2-cont:hover .h2-arrow{opacity:1; transform:none; color:var(--accent-strong);}
.h2-tile{flex-direction:column; align-items:stretch; gap:14px; padding:18px 18px 16px;}
.h2-tile-top{display:flex; align-items:center; gap:8px;}
.h2-tile{position:relative;}
.h2-tile .h2-arrow{position:absolute; right:16px; bottom:16px;}
.h2-badge{font-size:11.5px; font-weight:600; color:var(--text-faint); background:var(--surface-2); padding:3px 9px; border-radius:99px; margin-left:auto;}
.h2-tile .h2-tsub{white-space:normal; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;}
.h2-head .linklike{border:none; background:none; padding:0; font-size:13.5px; font-weight:600; color:var(--accent-strong);}
.h2-head .linklike:hover{text-decoration:underline;}
.h2-more{border-style:dashed; background:transparent;}
.h2-more .h2-ico{background:var(--surface-2); color:var(--text-muted); font-size:18px;}
.h2-split{display:flex; flex-direction:column; gap:52px;}
.h2-split > .h2-col:first-child{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px;}
.h2-split > .h2-col:first-child > .h2-head{grid-column:1 / -1; margin-bottom:4px;}
.h2-cont{grid-column:span 2; background:linear-gradient(135deg, var(--accent-soft), var(--surface) 70%);}
.h2-cont-ico{flex:none; width:46px; height:46px; border-radius:14px; background:var(--surface); color:var(--accent-strong); display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow);}
.h2-cont-ico svg{width:21px; height:21px;}
.h2-recent{padding:14px 16px;}
.h2-note{grid-column:span 2; align-self:center; font-size:13px; color:var(--text-faint); margin:0; padding:0 6px;}
.h2-recs{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px;}
.h2-recs .prompt-card.prompt-tile{min-height:0;}
@media (max-width:1100px){
  .h2-grid, .h2-split > .h2-col:first-child{grid-template-columns:repeat(2,minmax(0,1fr));}
  .h2-cont{grid-column:1 / -1;}
  .h2-note{grid-column:1 / -1;}
}
@media (max-width:880px){
  .h2-hero{padding:18px 0 0; text-align:left;}
  .h2-hero::before{left:0; transform:none; height:220px;}
  .h2-hero h1{font-size:27px;}
  .h2-lead{margin:0 0 18px; font-size:14.5px;}
  .h2-search input{height:54px; font-size:16px !important; padding-right:16px !important;}
  .h2-kbd{display:none;}
  .h2-try{justify-content:flex-start; flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none; margin-right:-16px;}
  .h2-try::-webkit-scrollbar{display:none;}
  .h2-try button{flex:none; white-space:nowrap; text-decoration:none; border:1px solid var(--border); border-radius:99px; padding:6px 12px; background:var(--surface);}
  .h2-try button + button::before{content:none;}
  .h2-section, .h2-split{margin-top:34px; gap:34px;}
  .h2-head{align-items:flex-start;}
  .h2-seg{width:100%;} .h2-seg button{flex:1;}
  .h2-grid{grid-template-columns:1fr 1fr; gap:10px;}
  .h2-tile{gap:10px; padding:14px;}
  .h2-tile .h2-arrow{display:none;}
  .h2-badge{font-size:11px; padding:2px 7px;}
  .h2-ico{width:40px; height:40px; font-size:19px; border-radius:12px;}
  .h2-tlabel{font-size:14px;}
  .h2-tsub{white-space:normal; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;}
  .h2-split > .h2-col:first-child{grid-template-columns:1fr;}
  .h2-recs{grid-template-columns:1fr; gap:10px;}
}

/* ---------- v2: simplified surfaces ---------- */
.home-cols{display:grid; grid-template-columns:1.4fr 1fr; gap:26px; align-items:start;}
.home-block{margin-bottom:26px;}
.continue-card{display:flex; align-items:center; gap:14px; padding:16px 18px; border:1px solid var(--border); border-radius:var(--radius-lg); background:linear-gradient(150deg,var(--accent-soft),var(--surface) 72%); cursor:pointer; margin-bottom:22px;}
.continue-card:hover{border-color:var(--accent);}
.continue-card .cc-ico{width:38px; height:38px; border-radius:10px; background:var(--surface); display:flex; align-items:center; justify-content:center; flex:none; color:var(--accent-strong);}
.continue-card .cc-ico svg{width:19px; height:19px;}
.continue-card h3{font-size:14.5px; margin-bottom:2px;}
.continue-card p{font-size:12.5px; color:var(--text-muted);}
.continue-card .cc-go{margin-left:auto; color:var(--text-faint); flex:none;}

/* Library landing */
.lib-landing{max-width:760px; margin:8px auto 4px;}
.lib-landing h1{font-size:24px; letter-spacing:-0.015em; margin-bottom:14px; text-align:center;}
.lib-quicklinks{display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-top:14px;}

/* Library scope banner + landing sections */
.scope-banner{padding:14px 18px; border:1px solid var(--border); border-left:3px solid var(--accent);
  border-radius:var(--radius); background:var(--surface); margin:6px 0 22px;}
.scope-banner .sb-label{font-family:var(--font-display); font-weight:600; font-size:14px;}
.scope-banner .sb-line{font-size:12.5px; color:var(--text-muted); margin:3px 0 6px;}
.scope-banner .linklike{font-size:12px; color:var(--accent-strong); background:none; border:none; font-weight:600; padding:0;}
.lib-scopeline{font-size:12.5px; color:var(--text-faint); margin:6px 0 20px;}
.starter-strip{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; align-items:start;}
.starter-strip .prompt-card{padding:12px 14px;}
.starter-strip .prompt-card-title{display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
.starter-strip .prompt-card-desc{-webkit-line-clamp:2;}
.cat-group{font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-faint); font-weight:700; margin:2px 0 10px;}
details.cat-more{margin-top:16px;}
details.cat-more > summary{cursor:pointer; font-size:12.5px; font-weight:600; color:var(--accent-strong); list-style:none;}
details.cat-more > summary::-webkit-details-marker{display:none;}
.rec-reason{font-size:11.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-faint); font-weight:700; margin:14px 0 8px;}
.rec-reason:first-child{margin-top:0;}

/* Detail: action-first */
.detail-hero-actions{display:flex; flex-direction:column; gap:10px; margin:4px 0 20px;}
.btn-use{display:inline-flex; align-items:center; justify-content:center; gap:9px; width:100%; padding:13px 18px;
  border-radius:var(--radius); border:1px solid var(--accent); background:var(--accent); color:var(--accent-text-on);
  font-weight:600; font-size:14.5px; font-family:var(--font-display);}
.btn-use:hover{background:var(--accent-strong); border-color:var(--accent-strong);}
.btn-use svg{width:17px; height:17px;}
.detail-secondary{display:flex; gap:8px; flex-wrap:wrap;}
.detail-secondary .btn{flex:1; min-width:120px; justify-content:center;}
.detail-outcome{display:flex; gap:10px; padding:12px 14px; border-radius:var(--radius); background:var(--accent-soft); color:var(--accent-strong); font-size:13px; line-height:1.55; margin-bottom:18px;}
.detail-outcome svg{width:16px; height:16px; flex:none; margin-top:2px;}
details.detail-expand{border:1px solid var(--border); border-radius:var(--radius); margin-bottom:14px; background:var(--surface);}
details.detail-expand > summary{list-style:none; cursor:pointer; padding:12px 14px; font-weight:600; font-size:13px; display:flex; align-items:center; gap:8px;}
details.detail-expand > summary::-webkit-details-marker{display:none;}
details.detail-expand > summary .chev{margin-left:auto; transition:transform .15s; color:var(--text-faint);}
details.detail-expand[open] > summary .chev{transform:rotate(90deg);}
details.detail-expand > summary:hover{background:var(--surface-2);}
details.detail-expand .expand-body{padding:4px 16px 16px; border-top:1px solid var(--border);}
.quality-line{display:flex; align-items:baseline; gap:8px; font-size:13px; color:var(--text-muted);}
.quality-line b{font-family:var(--font-mono); font-size:20px; font-weight:600; color:var(--text);}

/* Me dashboard */
.me-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:24px;}
.me-stat{padding:14px 16px; border:1px solid var(--border); border-radius:var(--radius); background:var(--surface);}
.me-stat .num{font-family:var(--font-mono); font-size:24px; font-weight:600;}
.me-stat .label{font-size:11.5px; color:var(--text-muted); margin-top:2px;}
.seg{display:inline-flex; padding:3px; gap:2px; background:var(--surface-2); border-radius:99px; border:1px solid var(--border); margin-bottom:16px; flex-wrap:wrap;}
.seg button{border:none; background:none; padding:6px 14px; border-radius:99px; font-size:12.5px; font-weight:600; color:var(--text-muted);}
.seg button.active{background:var(--surface); color:var(--text); box-shadow:var(--shadow);}

/* ---------- Prompt Framework ---------- */
.fw-module{border:1px solid var(--border); border-radius:var(--radius-lg); background:linear-gradient(150deg,var(--accent-soft),var(--surface) 72%); padding:18px 20px; margin-bottom:24px;}
.fw-module-head{display:flex; align-items:flex-start; gap:12px; margin-bottom:14px;}
.fw-module-head h2{font-size:16px;}
.fw-module-head p{font-size:12.8px; color:var(--text-muted); margin-top:2px;}
.fw-module-head .chip{margin-left:auto; flex:none;}
.fw-levels{display:flex; flex-direction:column; gap:8px;}
.fw-level-row{display:flex; align-items:center; gap:14px; padding:12px 14px; border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); text-align:left; width:100%;}
.fw-level-row:hover{border-color:var(--accent);}
.fw-level-code{font-family:var(--font-mono); font-weight:600; font-size:12px; letter-spacing:.03em; color:var(--accent-strong); background:var(--accent-soft); padding:5px 8px; border-radius:6px; flex:none; min-width:150px; text-align:center;}
.fw-level-meta{display:flex; flex-direction:column; gap:1px; flex:1; min-width:0;}
.fw-level-meta b{font-size:13px;}
.fw-level-meta span{font-size:12px; color:var(--text-muted);}
.fw-level-prog{display:flex; align-items:center; gap:8px; flex:none; width:120px;}
.fw-level-prog .progress-track{flex:1; margin-top:0;}
.fw-level-pct{font-size:11px; font-family:var(--font-mono); color:var(--text-faint); width:30px; text-align:right;}
.fw-level-row > svg{width:16px; height:16px; color:var(--text-faint); flex:none;}

.fw-hero-visual{display:flex; flex-wrap:wrap; gap:8px; margin:14px 0 20px;}
.fw-tile{display:flex; flex-direction:column; align-items:center; gap:3px; padding:10px 12px; border:1px solid var(--border-strong); border-radius:var(--radius); background:var(--surface); min-width:78px;}
.fw-tile.lit{border-color:var(--accent); background:var(--accent-soft);}
.fw-tile .l{font-family:var(--font-display); font-weight:700; font-size:18px; color:var(--accent-strong);}
.fw-tile .n{font-size:10.5px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.03em;}
button.fw-tile:hover{border-color:var(--accent);}

.fw-comp{border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); padding:16px 18px; margin-bottom:12px;}
.fw-comp-head{display:flex; align-items:center; gap:10px; margin-bottom:6px;}
.fw-comp-head h3{font-size:15px; flex:1;}
.fw-letter{width:28px; height:28px; border-radius:8px; background:var(--accent-soft); color:var(--accent-strong); display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:700; font-size:14px; flex:none;}
.fw-comp-short{font-size:13px; color:var(--text); margin-bottom:10px;}
.fw-comp-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:14px;}
.fw-comp-grid h4{font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-faint); margin-bottom:4px; font-family:var(--font-body); font-weight:700;}
.fw-comp-grid p{font-size:12.5px; color:var(--text-muted); line-height:1.55;}
.fw-good,.fw-bad{font-family:var(--font-mono); font-size:12px; line-height:1.5; padding:8px 10px; border-radius:var(--radius-sm);}
.fw-good{background:var(--accent-soft); color:var(--accent-strong);}
.fw-bad{background:var(--warn-soft); color:var(--warn);}

.fw-selector{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px;}
.fw-selector button{padding:6px 12px; border-radius:99px; border:1px solid var(--border); background:var(--surface); font-size:12px; font-weight:600; color:var(--text-muted);}
.fw-selector button.active{background:var(--accent-soft); color:var(--accent-strong); border-color:transparent;}

.fw-cov-table{width:100%; border-collapse:collapse; font-size:12.5px; margin:6px 0 4px;}
.fw-cov-table th{text-align:left; color:var(--text-faint); font-weight:600; font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; padding:6px 8px; border-bottom:1px solid var(--border);}
.fw-cov-table td{padding:7px 8px; border-bottom:1px solid var(--border); vertical-align:top;}
.fw-status{display:inline-flex; align-items:center; gap:5px; font-weight:600; font-size:11.5px;}
.fw-status.s-strong{color:var(--accent-strong);}
.fw-status.s-weak{color:var(--warn);}
.fw-status.s-missing{color:var(--danger);}
.fw-status .dot{width:6px; height:6px; border-radius:50%; background:currentColor;}
.fw-compare{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
.fw-compare h4{font-size:12px; margin-bottom:6px;}

@media (max-width:720px){
  .fw-comp-grid{grid-template-columns:1fr;}
  .fw-level-prog{display:none;}
  .fw-compare{grid-template-columns:1fr;}
  .fw-level-code{min-width:0;}
}

/* ---------- Account auth (part_auth.js) ---------- */
.auth-card{width:min(460px,100%);}
.auth-card h1{font-size:20px; letter-spacing:-0.01em; margin:16px 0 4px;}
.auth-tabs{display:flex; gap:4px; background:var(--surface-2); border-radius:var(--radius-sm); padding:4px; margin:14px 0 18px;}
.auth-tab{flex:1; border:0; background:transparent; padding:8px 10px; font-size:12.5px; font-weight:600; color:var(--text-muted); border-radius:calc(var(--radius-sm) - 2px); cursor:pointer;}
.auth-tab.active{background:var(--surface); color:var(--text); box-shadow:var(--shadow-sm);}
.auth-card form{display:block;}
.auth-card .auth-select,.auth-card input.name-input{width:100%; padding:11px 13px; font-size:14px; border-radius:var(--radius-sm); border:1.5px solid var(--border-strong); background:var(--surface); color:var(--text); text-transform:none; letter-spacing:normal;}
.auth-card .auth-select:focus,.auth-card input.name-input:focus{border-color:var(--accent); outline:none;}
.auth-2col{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.auth-row{display:flex; align-items:center; justify-content:space-between; margin:12px 0 2px; gap:10px; flex-wrap:wrap;}
.auth-check{display:flex; align-items:center; gap:8px; font-size:12.5px; font-weight:500; color:var(--text-muted); text-transform:none;}
.auth-check input{width:auto;}
.auth-link{background:none; border:0; color:var(--accent-strong); font-size:12.5px; font-weight:600; padding:0; cursor:pointer;}
.auth-link:hover{text-decoration:underline;}
.auth-card .auth-error{color:var(--danger); font-size:12.5px; margin:10px 0 2px; min-height:16px;}
.auth-card .btn-primary{width:100%; justify-content:center; padding:11px; margin-top:12px; font-size:14px;}
