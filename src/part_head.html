.auth-2col .btn{width:100%; justify-content:center; padding:11px; margin-top:12px;}
.auth-social{display:flex; flex-direction:column; gap:10px; margin:0 0 4px;}
.auth-social-btn{
  display:flex; align-items:center; justify-content:center; gap:10px; width:100%; height:44px;
  border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--surface);
  color:var(--text); font-weight:600; font-size:14px; text-decoration:none;
}
.auth-social-btn:hover{background:var(--surface-2);}
.auth-social-btn svg{width:18px; height:18px; flex:none;}
.auth-social-btn.is-busy{opacity:.7; pointer-events:none;}
.auth-legal{margin:2px 0 0; font-size:12px; line-height:1.5; color:var(--text-faint); text-align:center;}
.auth-legal a, .auth-check a, .auth-note a{color:var(--accent-strong); font-weight:600;}
.auth-divider{display:flex; align-items:center; gap:12px; margin:10px 0 6px; color:var(--text-faint); font-size:12px;}
.auth-divider::before, .auth-divider::after{content:""; flex:1; height:1px; background:var(--border);}
.auth-note{font-size:12.5px; color:var(--text-muted); background:var(--surface-2); border-radius:var(--radius-sm); padding:10px 12px; margin:12px 0;}
.verify-banner{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
  background:var(--warn-soft,#fff7ed); color:var(--warn-strong,#9a3412); border-bottom:1px solid var(--border);
  padding:9px 18px; font-size:12.5px; font-weight:500;}
.verify-banner .vb-actions{display:flex; align-items:center; gap:8px;}
.verify-banner .vb-btn{border:1px solid currentColor; background:transparent; color:inherit; font-size:12px; font-weight:600; padding:4px 10px; border-radius:6px; cursor:pointer;}
.verify-banner .vb-x{border:0; background:transparent; color:inherit; font-size:13px; cursor:pointer; opacity:.7;}
.verify-banner .vb-x:hover{opacity:1;}

/* ---- Account settings (part_auth.js#renderAccountView) ---- */
.acc-page{max-width:760px; margin:0 auto; display:flex; flex-direction:column; gap:16px; padding-bottom:40px;}
.acc-loading{color:var(--text-muted); padding:40px 0; text-align:center;}
.acc-hero{display:flex; align-items:center; gap:16px; padding:6px 2px 4px;}
.acc-av-lg{width:60px; height:60px; font-size:21px;}
.acc-hero-body{min-width:0;}
.acc-hero h2{font-size:22px; margin:0 0 2px;}
.acc-hero p{margin:0; color:var(--text-muted); font-size:13.5px; display:flex; flex-wrap:wrap; align-items:center; gap:8px; overflow-wrap:anywhere;}
.acc-hero-meta{margin-top:2px !important; font-size:12.5px !important; color:var(--text-faint) !important;}
.acc-badge{font-size:11px; font-weight:700; padding:2px 8px; border-radius:999px;}
.acc-badge.ok{background:var(--accent-soft); color:var(--accent-strong);}
.acc-badge.warn{background:var(--danger-soft); color:var(--danger);}
.acc-card{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:18px 20px;}
.acc-card h3{font-size:15.5px; margin:0 0 2px;}
.acc-sub{margin:0 0 14px; color:var(--text-muted); font-size:13px;}
.acc-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px 14px;}
.acc-grid label, .acc-form label{display:block; font-size:12.5px; font-weight:600; margin:0 0 5px; color:var(--text-muted);}
.acc-form label{margin-top:12px;}
.acc-page input.name-input, .acc-page .auth-select, .modal .acc-form input.name-input{width:100%; padding:10px 12px; font-size:14px; border-radius:var(--radius-sm); border:1.5px solid var(--border-strong); background:var(--surface); color:var(--text); text-transform:none; letter-spacing:normal;}
.acc-page input.name-input:focus, .acc-page .auth-select:focus, .modal .acc-form input.name-input:focus{border-color:var(--accent); outline:none;}
.acc-row a.btn{text-decoration:none;}
.acc-span{grid-column:1 / -1;}
.acc-actions{display:flex; align-items:center; justify-content:flex-end; gap:12px; margin-top:16px;}
.acc-msg{font-size:12.5px; color:var(--text-muted);} .acc-msg.err{color:var(--danger);} .acc-msg.ok{color:var(--accent-strong);}
.acc-row{display:flex; align-items:center; gap:12px; padding:12px 0; border-top:1px solid var(--border);}
.acc-card h3 + .acc-row, .acc-sub + .acc-row{border-top:none; padding-top:4px;}
.acc-row-ico{flex:none; width:36px; height:36px; border-radius:10px; border:1px solid var(--border); display:flex; align-items:center; justify-content:center; background:var(--surface);}
.acc-row-ico svg{width:18px; height:18px;}
.acc-row-ico-key svg{color:var(--text-muted);}
.acc-row-body{flex:1; min-width:0; display:flex; flex-direction:column;}
.acc-row-body b{font-size:13.5px;}
.acc-row-body span{font-size:12.5px; color:var(--text-muted); overflow-wrap:anywhere;}
.acc-row .btn{flex:none;}
.acc-row .btn[disabled]{opacity:.5; cursor:not-allowed;}
.acc-danger{border-color:color-mix(in srgb, var(--danger) 35%, var(--border));}
.acc-danger h3{color:var(--danger);}
.acc-note{font-size:12px; color:var(--text-faint); margin:10px 0 0;}
.acc-modal-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:16px;}
.acc-legal{text-align:center; font-size:12.5px; color:var(--text-faint); margin:4px 0 0;}
.acc-legal a{color:var(--text-muted);}
@media (max-width:640px){
  .acc-grid{grid-template-columns:1fr;}
  .acc-card{padding:16px;}
  .acc-row{flex-wrap:wrap;}
  .acc-row-body{flex:1 1 calc(100% - 48px);}
  .acc-row .btn{margin-left:auto;}
  .acc-hero h2{font-size:19px;}
  .acc-page input.name-input, .acc-page .auth-select{font-size:16px;}  /* no iOS zoom on focus */
}

/* ============================================================================
   Split-screen auth — "Synottic Prompt Intelligence"
   Left = focused authentication. Right = brand composition (navy ground,
   intelligence-wave motif, headline, value signals, framed product visual).
   Applies to every auth screen (sign in / create account / access code /
   forgot / reset / verify) and the classic access-code gate.
   ========================================================================== */
.gate.auth-layout{
  display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.08fr);
  align-items:stretch; gap:0; padding:0; min-height:100vh; background:var(--bg);
}
.auth-layout .auth-pane{
  display:flex; align-items:center; justify-content:center;
  padding:40px 34px; overflow-y:auto;
}
.gate.auth-layout .gate-card.auth-card{
  width:min(400px,100%); max-width:400px; padding:0; border:0; background:none; box-shadow:none;
}
.auth-brandline{display:flex; align-items:center; gap:13px; margin-bottom:28px;}
.auth-brandline .gate-mark{width:48px; height:48px; margin:0;}
.auth-product{font-family:var(--font-display); font-weight:700; font-size:19px; letter-spacing:-0.01em; color:var(--text);}
@media (max-width:860px){ .auth-brandline .gate-mark{width:40px; height:40px;} .auth-product{font-size:17px;} }
.auth-card h1{font-size:22px; margin:0 0 5px;}
.auth-card .sub{color:var(--text-muted); font-size:13px; margin-bottom:18px;}

/* password visibility toggle */
.pw-wrap{position:relative;}
.pw-wrap .name-input{padding-right:44px !important;}
.pw-toggle{
  position:absolute; right:6px; top:50%; transform:translateY(-50%);
  width:32px; height:32px; display:flex; align-items:center; justify-content:center;
  border:0; background:none; color:var(--text-faint); border-radius:6px;
}
.pw-toggle:hover{color:var(--text-muted); background:var(--surface-2);}
.pw-toggle.is-on{color:var(--accent-strong);}
.pw-toggle svg{width:18px; height:18px;}

/* right-hand brand composition */
/* Desktop / tablet — the artwork fills the whole right side, edge to edge */
.auth-brand{
  position:relative; overflow:hidden; padding:0; display:block;
  background:
    radial-gradient(560px 300px at 100% 0%, rgba(3,201,177,0.22), transparent 60%),
    linear-gradient(158deg,#022A4B 4%, #011D35 88%);
}
.auth-brand-img{
  position:absolute; inset:0; z-index:1; width:100%; height:100%; display:block;
  object-fit:cover; object-position:0% 38%;
}
/* under the artwork: shows while it loads, or if it fails */
.auth-brand-msg{position:absolute; left:12%; right:12%; top:50%; transform:translateY(-50%);}
.auth-brand-msg .auth-brand-headline{font-size:38px;}
.auth-brand-msg .auth-brand-sub{font-size:15px;}
/* eyebrow / headline / sub — reused only by the mobile banner below the form */
.auth-eyebrow{font-size:11px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; color:#66E0CF; margin:0 0 12px;}
.auth-brand-headline{
  font-family:var(--font-display); font-weight:700; font-size:24px; line-height:1.1;
  letter-spacing:-0.02em; color:#FFFFFF; margin:0 0 10px; text-wrap:balance;
}
.auth-brand-sub{font-size:13px; line-height:1.6; color:rgba(241,246,249,0.82); margin:0;}

/* Mobile — authentication first; artwork swapped for a compact text banner */
@media (max-width:860px){
  .gate.auth-layout{grid-template-columns:1fr; align-content:start;}
  .auth-layout .auth-pane{order:1; padding:32px 22px 26px; align-items:flex-start;}
  .auth-brand{
    order:2; padding:24px 24px 28px;
    background:
      radial-gradient(560px 300px at 100% 0%, rgba(3,201,177,0.22), transparent 60%),
      linear-gradient(158deg,#022A4B 4%, #011D35 88%);
  }
  .auth-brand-img{display:none;}
  .auth-brand-msg{display:block; position:static; transform:none;}
  .auth-brand-msg .auth-brand-headline{font-size:24px;}
  .auth-brand-msg .auth-brand-sub{font-size:13px;}
}

/* ============================================================================
   Public marketing landing — part_auth.js#renderLanding(). Shown to logged-out
   visitors at `/`; the sign-in gate lives at `/login`. Uses the same tokens as
   the rest of the app, so light/dark just work.
   ========================================================================== */
#lp{font-family:var(--font-body); color:var(--text); background:var(--bg);}
/* ---------- Landing v2 (lpx) ---------- */
.lpx .lp-bar{background:color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter:blur(10px);}
.lpx-hero{position:relative; overflow:hidden; text-align:center; padding:72px 0 64px; isolation:isolate;}
.lpx-hero::before{content:""; position:absolute; z-index:-1; inset:-120px -10% auto; height:620px;
  background:radial-gradient(40% 50% at 30% 30%, var(--accent-soft), transparent 70%), radial-gradient(35% 45% at 72% 20%, color-mix(in srgb, var(--good-blue-soft) 90%, transparent), transparent 70%);}
.lpx-pill{display:inline-flex; align-items:center; gap:10px; margin:0 0 22px; padding:5px 14px 5px 5px; border:1px solid var(--border); border-radius:99px; background:var(--surface); font-size:13px; font-weight:600; color:var(--text-muted); box-shadow:var(--shadow);}
.lpx-pill span{background:var(--accent); color:var(--accent-text-on); border-radius:99px; padding:3px 9px; font-size:11px; letter-spacing:.04em;}
.lpx-h1{font-family:var(--font-display); font-weight:700; font-size:clamp(34px,5.6vw,62px); line-height:1.05; letter-spacing:-0.035em; margin:0 auto; max-width:900px; text-wrap:balance;}
.lpx-h1 em{font-style:normal; background:linear-gradient(90deg, var(--accent), var(--good-blue)); -webkit-background-clip:text; background-clip:text; color:transparent;}
.lpx-lead{font-size:clamp(16px,1.6vw,19px); line-height:1.6; color:var(--text-muted); max-width:640px; margin:20px auto 34px;}
.lpx-search{position:relative; max-width:760px; margin:0 auto; display:flex; align-items:center; background:var(--surface); border:1px solid var(--border-strong); border-radius:20px; padding:8px 8px 8px 58px;
  box-shadow:0 18px 50px rgba(14,124,107,.12), 0 2px 6px rgba(20,24,26,.06); transition:border-color .15s, box-shadow .15s;}
.lpx-search:focus-within{border-color:var(--accent); box-shadow:0 0 0 5px var(--accent-soft), 0 18px 50px rgba(14,124,107,.14);}
.lpx-search svg{position:absolute; left:22px; width:22px; height:22px; color:var(--text-faint);}
.lpx-search input{flex:1; min-width:0; border:none !important; background:none !important; box-shadow:none !important; outline:none; font-size:17px; padding:14px 8px; color:var(--text);}
.lpx-go{flex:none; border:none; border-radius:14px; background:var(--accent); color:var(--accent-text-on); font-family:var(--font-display); font-weight:600; font-size:15px; padding:15px 22px; cursor:pointer;}
.lpx-go:hover{background:var(--accent-strong);}
.lpx-quick{display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin:18px auto 0; max-width:760px;}
.lpx-quick button{display:inline-flex; align-items:center; gap:7px; padding:8px 14px; border-radius:99px; border:1px solid var(--border); background:var(--surface); color:var(--text-muted); font-size:13.5px; cursor:pointer; transition:border-color .12s, color .12s;}
.lpx-quick button:hover{border-color:var(--accent); color:var(--accent-strong);}
.lpx-trust{margin:26px 0 0; font-size:13.5px; color:var(--text-faint);}
.lpx-trust b{color:var(--text-muted); font-weight:600;}
.lpx-trust span{display:inline-block; margin-left:14px; padding-left:14px; border-left:1px solid var(--border-strong);}
.lpx-results{max-width:1040px; margin:34px auto 0; text-align:left; background:var(--surface); border:1px solid var(--border); border-radius:22px; padding:22px; box-shadow:var(--shadow-lg); animation:lpxIn .25s ease;}
@keyframes lpxIn{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;}}
.lpx-res-head{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:16px;}
.lpx-res-head b{font-family:var(--font-display); font-size:17px;}
.lpx-left{font-size:12.5px; font-weight:600; color:var(--accent-strong); background:var(--accent-soft); padding:5px 12px; border-radius:99px;}
.lpx-grid{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px;}
.lpx-card{display:flex; flex-direction:column; gap:6px; text-align:left; padding:16px; border:1px solid var(--border); border-radius:16px; background:var(--bg); color:var(--text); cursor:pointer; transition:border-color .15s, transform .15s, box-shadow .15s;}
.lpx-card:hover{border-color:var(--accent); transform:translateY(-2px); box-shadow:0 10px 26px rgba(14,124,107,.10);}
.lpx-card-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:4px;}
.lpx-card-state{font-size:11.5px; font-weight:600; color:var(--text-faint);}
.lpx-card b{font-size:15px; line-height:1.3;}
.lpx-card span{font-size:13px; color:var(--text-muted); line-height:1.45;}
.lpx-card em{font-style:normal; font-size:11.5px; color:var(--text-faint); margin-top:auto; padding-top:6px;}
.lpx-more{background:linear-gradient(140deg, var(--accent-soft), var(--surface)); border-color:var(--accent);}
.lpx-more em{color:var(--accent-strong); font-weight:700; font-size:13px;}
.lpx-ico{flex:none; width:42px; height:42px; border-radius:13px; background:var(--accent-soft); display:inline-flex; align-items:center; justify-content:center; font-size:20px;}
.lpx-empty{display:flex; flex-direction:column; align-items:center; gap:10px; text-align:center; padding:20px;}
.lpx-empty span{color:var(--text-muted); font-size:14px;}
.lp-wrap.lpx-sec, .lpx-sec{padding:88px 24px;}
.lpx-band{background:var(--surface); border-top:1px solid var(--border); border-bottom:1px solid var(--border);}
.lpx-head{text-align:center; max-width:680px; margin:0 auto 40px;}
.lpx-h2{font-family:var(--font-display); font-weight:700; font-size:clamp(26px,3.4vw,40px); line-height:1.12; letter-spacing:-0.025em; margin:0; text-wrap:balance;}
.lpx-sub{font-size:16.5px; line-height:1.6; color:var(--text-muted); margin:14px 0 0;}
.lpx-vs{display:grid; grid-template-columns:.8fr 1.2fr; gap:20px; align-items:stretch;}
.lpx-vs > div{border:1px solid var(--border); border-radius:20px; padding:24px; background:var(--surface);}
.lpx-vs-b{border-color:var(--accent) !important; box-shadow:0 18px 50px rgba(14,124,107,.10);}
.lpx-vs-tag{display:inline-block; font-size:11.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--text-faint); margin-bottom:14px;}
.lpx-vs-tag-good{color:var(--accent-strong);}
.lpx-bubble{display:inline-block; padding:14px 18px; border-radius:18px 18px 18px 4px; background:var(--surface-2); font-size:16px; color:var(--text-muted);}
.lpx-cons, .lpx-pros{list-style:none; padding:0; margin:18px 0 0; display:flex; flex-direction:column; gap:8px; font-size:14px;}
.lpx-cons li::before{content:"✕"; color:var(--danger); font-weight:700; margin-right:9px;}
.lpx-pros li::before{content:"✓"; color:var(--accent); font-weight:700; margin-right:9px;}
.lpx-cons li{color:var(--text-muted);}
.lpx-prompt{margin:0; white-space:pre-wrap; word-break:break-word; font-family:var(--font-body); font-size:13.5px; line-height:1.65; color:var(--text); background:var(--bg); border:1px solid var(--border); border-radius:14px; padding:16px 18px; max-height:360px; overflow:auto;}
.lpx-lbl{display:inline-block; font-family:var(--font-mono); font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; padding:1px 7px; border-radius:6px; margin-right:6px; background:var(--accent-soft); color:var(--accent-strong); font-weight:700;}
.lpx-lbl-Context{background:var(--good-blue-soft); color:var(--good-blue);}
.lpx-lbl-Goal, .lpx-lbl-Constraints{background:var(--warn-soft); color:var(--warn);}
.lpx-lbl-Format, .lpx-lbl-Example{background:var(--surface-2); color:var(--text-muted);}
.lpx-var{background:color-mix(in srgb, var(--accent) 16%, transparent); color:var(--accent-strong); border-radius:5px; padding:0 3px; font-weight:600;}
.lpx-play{border:1px solid var(--border); border-radius:22px; background:var(--bg); padding:10px; box-shadow:var(--shadow);}
.lpx-tabs{display:flex; gap:4px; padding:4px; border-radius:14px; background:var(--surface-2); overflow-x:auto; scrollbar-width:none;}
.lpx-tabs button{flex:1; min-width:max-content; border:none; background:none; padding:10px 14px; border-radius:10px; font-size:13.5px; font-weight:600; color:var(--text-muted); cursor:pointer;}
.lpx-tabs button[aria-selected="true"]{background:var(--surface); color:var(--text); box-shadow:var(--shadow);}
.lpx-play-body{display:grid; grid-template-columns:.8fr 1.2fr; gap:18px; padding:18px 12px 12px;}
.lpx-fields{display:flex; flex-direction:column; gap:12px;}
.lpx-field{display:flex; flex-direction:column; gap:6px; font-size:13px; font-weight:600; color:var(--text);}
.lpx-field input{padding:12px 14px; font-size:15px; border-radius:12px;}
.lpx-actions{display:flex; flex-wrap:wrap; gap:8px; margin-top:12px;}
.lpx-note{text-align:center; color:var(--text-muted); margin:26px 0 0; font-size:15px;}
.lpx-link{border:none; background:none; padding:0; color:var(--accent-strong); font-weight:700; cursor:pointer; font-size:inherit;}
.lpx-link:hover{text-decoration:underline;}
.lpx-roles{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px;}
.lpx-role{display:flex; flex-direction:column; gap:6px; text-align:left; padding:20px; border:1px solid var(--border); border-radius:18px; background:var(--surface); color:var(--text); cursor:pointer; transition:border-color .15s, transform .15s, box-shadow .15s;}
.lpx-role:hover{border-color:var(--accent); transform:translateY(-3px); box-shadow:0 12px 30px rgba(14,124,107,.10);}
.lpx-role .lpx-ico{margin-bottom:8px;}
.lpx-role b{font-size:15.5px;}
.lpx-role span{font-size:13px; color:var(--text-muted); line-height:1.45;}
.lpx-role em{font-style:normal; font-size:12px; color:var(--accent-strong); font-weight:600; margin-top:auto; padding-top:8px;}
.lpx-gets{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:16px;}
.lpx-gets > div{padding:24px; border-radius:18px; border:1px solid var(--border); background:var(--bg);}
.lpx-gets .lpx-ico{margin-bottom:14px;}
.lpx-gets b{display:block; font-family:var(--font-display); font-size:16px; margin-bottom:6px;}
.lpx-gets p{margin:0; font-size:14px; line-height:1.55; color:var(--text-muted);}
.lpx-cta{display:flex; flex-direction:column; align-items:center; gap:12px; margin-top:40px;}
.lpx-cta p{margin:0; font-size:13.5px; color:var(--text-faint);}
.lpx-cta p a{color:var(--accent-strong); font-weight:600;}
.lpx-final .lpx-cta{flex-direction:row; justify-content:center; flex-wrap:wrap; margin-top:28px;}
.lpx-big{padding:16px 30px !important; font-size:16px !important; border-radius:14px !important;}
.lp-wrap.lpx-final{text-align:center; padding:100px 24px;}
.lpx-sticky{position:fixed; left:12px; right:12px; bottom:12px; z-index:40; display:none; align-items:center; justify-content:space-between; gap:10px; padding:10px 10px 10px 16px; border-radius:16px; background:var(--surface); border:1px solid var(--border); box-shadow:var(--shadow-lg); font-size:13.5px;}
.lpx-modal{position:fixed; inset:0; z-index:60; background:rgba(10,14,15,.5); backdrop-filter:blur(4px); display:flex; align-items:center; justify-content:center; padding:20px;}
.lpx-modal[hidden]{display:none;}
.lpx-modal-card{position:relative; width:min(720px,100%); max-height:92vh; overflow:auto; background:var(--surface); border-radius:22px; padding:26px; box-shadow:var(--shadow-lg); animation:lpxIn .2s ease;}
.lpx-x{position:absolute; top:14px; right:14px; width:36px; height:36px; border-radius:50%; border:1px solid var(--border); background:var(--surface); font-size:20px; color:var(--text-muted); cursor:pointer;}
.lpx-m-top{display:flex; gap:14px; align-items:center; padding-right:40px;}
.lpx-m-top h3{margin:0; font-family:var(--font-display); font-size:20px; letter-spacing:-0.01em;}
.lpx-m-top span:not(.lpx-ico){font-size:13px; color:var(--text-faint);}
.lpx-m-desc{margin:16px 0 6px; color:var(--text-muted); font-size:15px;}
.lpx-m-get{margin:0 0 16px; padding:10px 14px; border-radius:12px; background:var(--accent-soft); color:var(--accent-strong); font-size:14px;}
.lpx-m-prompt{max-height:300px;}
.lpx-m-nudge{display:flex; align-items:center; justify-content:space-between; gap:14px; margin-top:18px; padding:14px 16px; border-radius:14px; border:1px dashed var(--accent); font-size:13.5px; color:var(--text-muted);}
.lpx-locked{position:relative;}
.lpx-locked .lpx-prompt{max-height:220px; overflow:hidden; -webkit-mask-image:linear-gradient(180deg,#000 30%,transparent 95%); mask-image:linear-gradient(180deg,#000 30%,transparent 95%);}
.lpx-lockcard{display:flex; flex-direction:column; align-items:center; gap:10px; text-align:center; margin-top:-40px; position:relative; padding:22px; border-radius:18px; background:var(--surface); border:1px solid var(--border); box-shadow:var(--shadow-lg);}
.lpx-lockcard b{font-family:var(--font-display); font-size:18px;}
.lpx-lockcard span{font-size:14px; color:var(--text-muted); max-width:460px;}
@media (max-width:900px){
  .lpx-grid, .lpx-roles, .lpx-gets{grid-template-columns:repeat(2,minmax(0,1fr));}
  .lpx-vs, .lpx-play-body{grid-template-columns:1fr;}
}
@media (max-width:600px){
  .lpx-hero{padding:40px 0 44px; text-align:left;}
  .lpx-pill{font-size:12px;}
  .lpx-lead{margin:16px 0 24px;}
  .lpx-search{padding:6px 6px 6px 46px; border-radius:16px;}
  .lpx-search svg{left:16px; width:19px; height:19px;}
