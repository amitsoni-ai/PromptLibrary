<meta name="description" content="A learner-first AI prompt platform — learn, find, practice, customize, copy, improve and save prompts.">

<meta property="og:description" content="A learner-first AI prompt platform — learn, find, practice, customize, copy, improve and save prompts.">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Synottic Prompt Library">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --logo:url("{{LOGO_DATA_URI}}");
  --bg:#F6F7F5; --surface:#FFFFFF; --surface-2:#EFF2EF; --surface-hover:#E9ECE8;
  --border:#E1E4DF; --border-strong:#CDD2CA;
  --text:#14181A; --text-muted:#5B6660; --text-faint:#8B958E;
  --accent:#0E7C6B; --accent-strong:#095F52; --accent-soft:#E3F2EE; --accent-text-on:#FFFFFF;
  --warn:#96650D; --warn-soft:#FBF0DC;
  --danger:#B23A28; --danger-soft:#FBE8E4;
  --good-blue:#2E5F82; --good-blue-soft:#E7EEF3;
  --shadow: 0 1px 2px rgba(20,24,26,0.04), 0 4px 16px rgba(20,24,26,0.06);
  --shadow-lg: 0 8px 24px rgba(20,24,26,0.10), 0 2px 8px rgba(20,24,26,0.06);
  --radius-sm:6px; --radius:10px; --radius-lg:14px;
  --font-display:'Sora',ui-sans-serif,system-ui,sans-serif;
  --font-body:'IBM Plex Sans',ui-sans-serif,system-ui,-apple-system,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --sidebar-w: 240px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11171A; --surface:#171F22; --surface-2:#1D2629; --surface-hover:#233033;
    --border:#2A3538; --border-strong:#3A4649;
    --text:#EBF1EF; --text-muted:#9DACA6; --text-faint:#6C7A75;
    --accent:#34C9AE; --accent-strong:#57DFC5; --accent-soft:#153531; --accent-text-on:#06231E;
    --warn:#E2AC55; --warn-soft:#33280F;
    --danger:#E58272; --danger-soft:#331C17;
    --good-blue:#7FB0D6; --good-blue-soft:#182A35;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 16px rgba(0,0,0,0.35);
    --shadow-lg: 0 8px 28px rgba(0,0,0,0.45);
  }
}
:root[data-theme="dark"]{
  --bg:#11171A; --surface:#171F22; --surface-2:#1D2629; --surface-hover:#233033;
  --border:#2A3538; --border-strong:#3A4649;
  --text:#EBF1EF; --text-muted:#9DACA6; --text-faint:#6C7A75;
  --accent:#34C9AE; --accent-strong:#57DFC5; --accent-soft:#153531; --accent-text-on:#06231E;
  --warn:#E2AC55; --warn-soft:#33280F;
  --danger:#E58272; --danger-soft:#331C17;
  --good-blue:#7FB0D6; --good-blue-soft:#182A35;
  --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 16px rgba(0,0,0,0.35);
  --shadow-lg: 0 8px 28px rgba(0,0,0,0.45);
}

*{box-sizing:border-box;}
[hidden]{display:none !important;}
html,body{height:100%;}
body{
  background:var(--bg); color:var(--text); font-family:var(--font-body);
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--font-display); font-weight:600; text-wrap:balance; margin:0;}
::selection{background:var(--accent-soft); color:var(--text);}
a{color:inherit;}
button, input, textarea, select{font-family:inherit; font-size:inherit; color:inherit;}
button{cursor:pointer;}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px;}
::-webkit-scrollbar{width:10px; height:10px;}
::-webkit-scrollbar-thumb{background:var(--border-strong); border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}
@media (prefers-reduced-motion: reduce){ *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;} }

.tabular{font-variant-numeric:tabular-nums;}

/* ---------- Access gate ---------- */
.gate{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; background:
  radial-gradient(1200px 600px at 15% -10%, var(--accent-soft), transparent 60%),
  radial-gradient(900px 500px at 110% 10%, var(--good-blue-soft), transparent 55%), var(--bg);}
.gate-card{width:min(440px,100%); background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); box-shadow:var(--shadow-lg); padding:30px 28px;}
.gate-mark{width:46px; height:46px; background:var(--logo) center/contain no-repeat;}
.gate-mark svg{width:21px; height:21px;}
.gate h1{font-size:20px; letter-spacing:-0.01em; margin:16px 0 4px;}
.gate p.sub{color:var(--text-muted); font-size:13px; margin-bottom:20px;}
.gate label{display:block; font-size:12px; font-weight:600; color:var(--text-muted); margin-bottom:6px;}
.gate input{width:100%; padding:11px 13px; font-size:14px; letter-spacing:.04em; text-transform:uppercase; border-radius:var(--radius-sm); border:1.5px solid var(--border-strong); background:var(--surface);}
.gate input.name-input{text-transform:none; letter-spacing:normal;}
.gate input:focus{border-color:var(--accent);}
.gate .gate-error{color:var(--danger); font-size:12.5px; margin-top:8px; min-height:16px;}
.gate .btn-primary{width:100%; justify-content:center; padding:11px; margin-top:14px; font-size:14px;}
.gate .gate-hint{margin-top:18px; padding-top:16px; border-top:1px solid var(--border); font-size:12px; color:var(--text-faint);}
.gate .gate-hint code{font-family:var(--font-mono); background:var(--surface-2); padding:2px 6px; border-radius:5px; color:var(--text-muted); cursor:pointer;}
.gate .gate-hint code:hover{background:var(--surface-hover); color:var(--text);}
.gate-admin-link{background:none; border:none; color:var(--text-faint); font-size:12px; font-weight:600; padding:0;}
.gate-admin-link:hover{color:var(--accent-strong);}

/* ---------- Admin console ---------- */
#admin-root{min-height:100vh; background:var(--bg);}
.admin-shell{max-width:1120px; margin:0 auto; padding:24px 24px 64px;}
.admin-top{display:flex; align-items:center; gap:12px; margin-bottom:18px;}
.admin-top h1{font-size:18px; flex:1;}
.admin-table{width:100%; border-collapse:collapse; font-size:12.5px;}
.admin-table th{text-align:left; color:var(--text-faint); font-weight:600; font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; padding:8px 10px; border-bottom:1px solid var(--border);}
.admin-table td{padding:9px 10px; border-bottom:1px solid var(--border); vertical-align:top;}
.admin-table tr:hover td{background:var(--surface-2);}
.admin-code{font-family:var(--font-mono); font-weight:600;}
.switch{width:34px; height:20px; border-radius:99px; background:var(--border-strong); position:relative; display:inline-block; flex:none; transition:background .15s; border:none; padding:0; cursor:pointer;}
.switch.on{background:var(--accent);}
.switch i{position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:#fff; transition:left .15s;}
.switch.on i{left:16px;}
.checkgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:5px 16px; max-height:240px; overflow:auto; border:1px solid var(--border); border-radius:var(--radius-sm); padding:12px; background:var(--surface-2);}
.checkgrid label{display:flex; gap:7px; align-items:flex-start; font-size:12.5px; font-weight:400; color:var(--text); cursor:pointer; line-height:1.4;}
.checkgrid input{margin-top:2px;}
.role-fn-group{grid-column:1/-1; font-size:10px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-faint); font-weight:700; margin:8px 0 2px;}

/* ---------- "View as" preview banner ---------- */
body.previewing{--pbh:38px;}
#preview-banner{position:fixed; top:0; left:0; right:0; height:var(--pbh); z-index:85;
  display:flex; align-items:center; gap:12px; padding:0 14px; background:var(--warn); color:#1c1300;
  font-size:12.5px; font-weight:600; box-shadow:0 2px 10px rgba(0,0,0,.18);}
#preview-banner svg{width:15px; height:15px; flex:none;}
#preview-banner span{white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
#preview-banner select{background:rgba(255,255,255,.9); border:none; border-radius:6px; padding:4px 8px;
  font-weight:600; color:#1c1300; max-width:260px; margin-left:auto;}
#preview-banner .pb-x{background:#1c1300; color:var(--warn); border:none; border-radius:6px;
  padding:6px 12px; font-weight:700; cursor:pointer; flex:none;}
body.previewing #app{margin-top:var(--pbh);}
body.previewing .sidebar{top:var(--pbh); height:calc(100vh - var(--pbh));}
body.previewing .topbar{top:var(--pbh);}
@media (max-width:880px){ #preview-banner select{max-width:118px;} #preview-banner .pb-scope{display:none;} }
.gate-resolved{margin-top:10px; padding:10px 12px; background:var(--accent-soft); color:var(--accent-strong); border-radius:var(--radius-sm); font-size:12.5px;}

/* ---------- App shell ---------- */
#app{display:flex; min-height:100vh;}

.sidebar{
  width:var(--sidebar-w); flex:none; background:var(--surface); border-right:1px solid var(--border);
  display:flex; flex-direction:column; position:sticky; top:0; height:100vh; overflow-y:auto;
}
.brand{display:flex; align-items:center; gap:10px; padding:18px 16px 12px;}
.brand-mark{width:30px; height:26px; background:var(--logo) center/contain no-repeat; flex:none;}
.brand-mark svg{width:17px; height:17px;}
.brand-name{font-family:var(--font-display); font-weight:700; font-size:14.5px; letter-spacing:-0.01em; line-height:1.2;}
.brand-sub{font-size:10.5px; color:var(--text-faint); letter-spacing:.04em; text-transform:uppercase; margin-top:1px;}

.learner-box{margin:2px 12px 6px; padding:9px 11px; border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--surface-2);}
.learner-box .lb-name{font-weight:600; font-size:12.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.learner-box .lb-meta{font-size:11px; color:var(--text-faint); margin-top:1px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.learner-box .lb-signout{margin-top:6px; font-size:11px; color:var(--accent-strong); background:none; border:none; padding:0; font-weight:600;}

.nav{padding:4px 10px; display:flex; flex-direction:column; gap:1px;}
.nav-group-label{font-size:10px; text-transform:uppercase; letter-spacing:.07em; color:var(--text-faint); padding:12px 10px 4px;}
.nav-item{
  display:flex; align-items:center; gap:10px; padding:7px 10px; border-radius:var(--radius-sm);
  color:var(--text-muted); font-weight:500; font-size:13px; background:none; border:none; text-align:left; width:100%;
}
.nav-item svg{width:16px; height:16px; flex:none; opacity:.85;}
.nav-item:hover{background:var(--surface-2); color:var(--text);}
.nav-item.active{background:var(--accent-soft); color:var(--accent-strong); font-weight:600;}
.nav-item.active svg{opacity:1;}
.nav-kbd{margin-left:auto; font-size:10px; color:var(--text-faint); border:1px solid var(--border); border-radius:4px; padding:1px 5px; font-family:var(--font-mono);}
.nav-count{margin-left:auto; font-size:10.5px; color:var(--text-faint); font-variant-numeric:tabular-nums;}

.sidebar-section-label{font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-faint); padding:14px 14px 4px;}
.sidebar-footer{margin-top:auto; padding:12px 14px; border-top:1px solid var(--border); font-size:11px; color:var(--text-faint);}
.sidebar-footer .stat-row{display:flex; justify-content:space-between; padding:2px 0;}
.sidebar-footer b{color:var(--text-muted); font-variant-numeric:tabular-nums;}

.main{flex:1; min-width:0; display:flex; flex-direction:column;}
.topbar{
  position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:12px;
  padding:12px 24px; background:color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter:blur(8px);
  border-bottom:1px solid var(--border);
}
.topbar-title{font-family:var(--font-display); font-weight:600; font-size:16px; white-space:nowrap;}
.topbar-search{flex:1; max-width:420px; position:relative;}
.topbar-search input{width:100%;}
.topbar-actions{margin-left:auto; display:flex; gap:8px; align-items:center;}

.content{padding:24px; max-width:1180px; width:100%; margin:0 auto; flex:1;}
.content.wide{max-width:1360px;}

/* ---------- Inputs / buttons ---------- */
input[type="text"], input[type="search"], textarea, select{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm);
  padding:8px 12px; color:var(--text); width:100%;
}
input[type="text"]:focus, input[type="search"]:focus, textarea:focus, select:focus{border-color:var(--accent);}
textarea{resize:vertical; font-family:var(--font-mono); line-height:1.55; font-size:13px;}

.btn{
  display:inline-flex; align-items:center; gap:7px; padding:8px 14px; border-radius:var(--radius-sm);
  border:1px solid var(--border-strong); background:var(--surface); font-weight:500; font-size:13px; white-space:nowrap;
}
.btn:hover{background:var(--surface-2);}
.btn svg{width:15px; height:15px;}
.btn-primary{background:var(--accent); border-color:var(--accent); color:var(--accent-text-on);}
.btn-primary:hover{background:var(--accent-strong); border-color:var(--accent-strong);}
.btn-ghost{border-color:transparent; background:none;}
.btn-ghost:hover{background:var(--surface-2);}
.btn-sm{padding:5px 10px; font-size:12px;}
.btn-icon{padding:7px; width:32px; height:32px; justify-content:center;}
.btn[disabled]{opacity:.5; cursor:not-allowed;}
.btn-danger{color:var(--danger); border-color:var(--danger);}

/* ---------- Chips / badges ---------- */
.chip{display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:99px; font-size:11.5px; font-weight:500; border:1px solid var(--border); background:var(--surface-2); color:var(--text-muted); white-space:nowrap;}
.chip-accent{background:var(--accent-soft); color:var(--accent-strong); border-color:transparent;}
.chip-blue{background:var(--good-blue-soft); color:var(--good-blue); border-color:transparent;}
.chip-warn{background:var(--warn-soft); color:var(--warn); border-color:transparent;}
.badge-health{display:inline-flex; align-items:center; gap:5px; padding:2px 8px; border-radius:99px; font-size:11px; font-weight:600;}
.health-excellent{background:var(--accent-soft); color:var(--accent-strong);}
.health-good{background:var(--good-blue-soft); color:var(--good-blue);}
.health-needs{background:var(--warn-soft); color:var(--warn);}
.health-review{background:var(--danger-soft); color:var(--danger);}
.badge-health .dot{width:6px; height:6px; border-radius:50%; background:currentColor;}
.diff-dot{display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:600; color:var(--text-muted);}
.diff-dot i{width:7px; height:7px; border-radius:50%; display:inline-block;}
.diff-Beginner i{background:var(--accent);} .diff-Intermediate i{background:var(--good-blue);} .diff-Advanced i{background:var(--warn);}

.quality-pill{display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600; font-family:var(--font-mono);}
.quality-bar{width:38px; height:5px; border-radius:3px; background:var(--surface-2); overflow:hidden;}
.quality-bar > i{display:block; height:100%; border-radius:3px;}
.q-high i{background:var(--accent);} .q-mid i{background:var(--good-blue);} .q-low i{background:var(--warn);}
.q-high{color:var(--accent-strong);} .q-mid{color:var(--good-blue);} .q-low{color:var(--warn);}

/* ---------- Cards ---------- */
.prompt-card{
  display:flex; flex-direction:column; gap:6px; padding:14px 16px; border:1px solid var(--border); border-radius:var(--radius);
  background:var(--surface); cursor:pointer; position:relative;
}
.prompt-card:hover{border-color:var(--border-strong); box-shadow:var(--shadow);}
.prompt-card-top{display:flex; align-items:flex-start; gap:10px;}
.prompt-card-title{font-weight:600; font-size:14.5px; letter-spacing:-0.005em; flex:1; min-width:0;}
.prompt-card-desc{color:var(--text-muted); font-size:12.8px; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;}
.prompt-card-meta{display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-top:2px;}
.prompt-card-actions{display:flex; gap:4px; flex:none;}
.fav-btn{background:none; border:none; padding:5px; border-radius:6px; color:var(--text-faint); display:flex;}
.fav-btn:hover{background:var(--surface-2); color:var(--warn);}
.fav-btn.is-fav{color:var(--warn);}
.fav-btn svg{width:17px; height:17px;}
.result-count{color:var(--text-faint); font-size:12.5px; padding:2px 2px 10px;}

/* ---------- Home ---------- */
.hero{padding:34px 4px 22px; max-width:820px;}
.hero .greeting{font-size:13px; color:var(--text-muted); margin-bottom:8px;}
.hero h1{font-size:28px; letter-spacing:-0.015em; margin-bottom:16px;}
.search-hero{position:relative;}
.search-hero input{
  width:100%; padding:15px 48px 15px 46px; font-size:15px; border-radius:var(--radius-lg);
  border:1.5px solid var(--border-strong); box-shadow:var(--shadow);
}
.search-hero input:focus{border-color:var(--accent);}
.search-hero .icon-search{position:absolute; left:16px; top:50%; transform:translateY(-50%); width:19px; height:19px; color:var(--text-faint);}
.search-hero .icon-clear{position:absolute; right:14px; top:50%; transform:translateY(-50%); width:19px; height:19px; color:var(--text-faint); background:none; border:none; padding:2px;}
.search-examples{display:flex; flex-wrap:wrap; gap:7px; margin-top:12px;}
.search-example-chip{padding:5px 11px; border-radius:99px; font-size:12px; border:1px solid var(--border); background:var(--surface); color:var(--text-muted);}
.search-example-chip:hover{border-color:var(--accent); color:var(--accent-strong);}

.quick-actions{display:grid; grid-template-columns:repeat(6,1fr); gap:10px; margin:22px 0 30px; max-width:820px;}
.quick-action{display:flex; flex-direction:column; gap:8px; align-items:flex-start; padding:13px; border-radius:var(--radius); border:1px solid var(--border); background:var(--surface); text-align:left;}
.quick-action:hover{border-color:var(--accent); background:var(--accent-soft);}
.quick-action svg{width:18px; height:18px; color:var(--accent-strong);}
.quick-action-label{font-weight:600; font-size:12.5px;}

.goal-grid{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:32px;}
.goal-chip{padding:8px 15px; border-radius:99px; border:1px solid var(--border); background:var(--surface); font-weight:500; font-size:13px; display:flex; align-items:center; gap:7px;}
.goal-chip:hover{border-color:var(--accent-strong); background:var(--accent-soft); color:var(--accent-strong);}

.section-title{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:12px;}
.section-title h2{font-size:15.5px;}
.section-title a, .section-title button.linklike{font-size:12.5px; color:var(--accent-strong); background:none; border:none; font-weight:500;}

.home-row{display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px; margin-bottom:30px;}
.mini-list{display:flex; flex-direction:column; gap:4px;}
.mini-item{display:flex; align-items:center; gap:9px; padding:8px 10px; border-radius:var(--radius-sm); font-size:13px;}
.mini-item:hover{background:var(--surface-2);}
.mini-item-title{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.empty-mini{color:var(--text-faint); font-size:12.5px; padding:10px;}

.potd{display:flex; gap:16px; padding:18px 20px; border:1px solid var(--border); border-radius:var(--radius-lg); background:linear-gradient(150deg, var(--accent-soft), var(--surface) 70%); margin-bottom:30px; cursor:pointer;}
.potd:hover{border-color:var(--accent);}
.potd-badge{font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; font-weight:700; color:var(--accent-strong);}
.potd h3{font-size:16px; margin:6px 0 4px;}
.potd p{font-size:12.8px; color:var(--text-muted); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}

.rec-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:10px; margin-bottom:30px;}

/* ---------- Filters ---------- */
.filter-bar{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:16px; padding:12px 14px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);}
.filter-bar select{width:auto; padding:6px 10px; font-size:12.5px; border-radius:6px;}
.filter-bar .spacer{flex:1;}
.filter-tag{display:flex; align-items:center; gap:5px; padding:4px 8px 4px 10px; background:var(--accent-soft); color:var(--accent-strong); border-radius:99px; font-size:12px; font-weight:500;}
.filter-tag button{background:none; border:none; color:inherit; display:flex; padding:1px;}
.filter-tag button svg{width:12px; height:12px;}
.results-list{display:flex; flex-direction:column; gap:8px;}

/* ---------- Category grid ---------- */
